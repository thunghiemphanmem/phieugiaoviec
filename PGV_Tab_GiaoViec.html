<style>
  #khuGvChinh { font-family: 'Times New Roman', Times, serif; font-size: 14px; }
  #khuGvChinh .hopDau { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-bottom: 2px solid #0d6efd; padding-bottom: 5px; background-color: #f8f9fa; padding: 10px; border-radius: 4px; }
  #khuGvChinh .tDe { font-weight: bold; font-size: 20px; color: #dc3545; text-transform: uppercase; margin: 0; }
  #khuGvChinh .hopLoc { display: flex; gap: 10px; align-items: center; }
  #khuGvChinh .nhapTuyChinh { font-size: 16px; font-weight: bold; color: #0d6efd; border: 1px solid #ced4da; padding: 4px 10px; border-radius: 4px; height: 34px; }
  #khuGvChinh .hopBang { background: white; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 5px; overflow-x: auto; }
  #khuGvChinh table { width: 100%; border-collapse: collapse; table-layout: auto; min-width: 1200px; }

  #khuGvChinh td { border: 1px solid #999; padding: 0 !important; vertical-align: middle; }
  
  #gvBangNv textarea.form-control, #gvBangNv input.form-control, #gvBangNv select.form-select {
    font-family: 'Times New Roman', Times, serif;
    font-size: 14px;
    border: none !important;
    border-radius: 0;
    box-shadow: none !important;
    width: 100%;
    padding: 6px 4px;
    margin: 0;
    background-color: transparent;
    resize: none;
    overflow-y: hidden;
    min-height: 35px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-sizing: border-box;
  }
  #gvBangNv input.form-control, #gvBangNv select.form-select {
    height: 100%;
    padding: 4px;
  }
  #khuGvChinh td.oHdong { text-align: center; padding: 2px !important; background-color: #f8f9fa; }
  #khuGvChinh .nutThem { margin-top: 5px; font-size: 13px; font-weight: bold; }
  
  #gvLopPhuTai { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); }
  #gvChuTai { margin-top: 20px; font-size: 22px; font-weight: 900; text-align: center; letter-spacing: 1.5px; text-transform: uppercase; background: linear-gradient(45deg, #0d6efd, #6610f2, #dc3545, #0d6efd); background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 2px 2px 10px rgba(0,0,0,0.1); animation: gradientMove 3s ease infinite, pulseText 1.5s infinite ease-in-out; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  #khuGvChinh input:disabled, #khuGvChinh select:disabled { background-color: #ffffff !important; cursor: not-allowed; color: #333; font-weight: normal; }
</style>

<div id="khuGvChinh">
    <div id="gvLopPhuTai"><div class="spinner-border text-primary spinner-border-lg" role="status"><span class="visually-hidden">Đang xử lý...</span></div><div id="gvChuTai">Đang xử lý...</div></div>
    <div class="hopDau">
      <div class="d-flex align-items-center">
        <div class="tDe">PHIẾU GIAO NHIỆM VỤ</div>
        <button id="btnCapNhatChung" class="btn btn-warning btn-sm fw-bold ms-3 shadow-sm" style="display:none;" onclick="gvCapNhatNhiemVuChung()"><i class="bi bi-pencil-square"></i> Cập nhật nhiệm vụ chung</button>
      </div>
      <div class="hopLoc">
        <button id="gvNutChth" class="btn btn-danger btn-sm fw-bold nhapTuyChinh" style="color: white; border: none; padding: 4px 10px; display: flex; align-items: center;" onclick="gvXlmChth(this)">Chuyển tháng mới</button>
        <input type="text" id="gvLocNam" class="form-control nhapTuyChinh" style="width: 140px; background-color: #ffffff;" disabled placeholder="Năm học">
        <select id="gvLocThang" class="form-select nhapTuyChinh" style="width: 120px;">
          <option value="Tháng 1">Tháng 1</option><option value="Tháng 2">Tháng 2</option><option value="Tháng 3">Tháng 3</option><option value="Tháng 4">Tháng 4</option>
          <option value="Tháng 5">Tháng 5</option><option value="Tháng 6">Tháng 6</option><option value="Tháng 7">Tháng 7</option><option value="Tháng 8">Tháng 8</option>
          <option value="Tháng 9">Tháng 9</option><option value="Tháng 10">Tháng 10</option><option value="Tháng 11">Tháng 11</option><option value="Tháng 12">Tháng 12</option>
        </select>
      </div>
    </div>

    <div class="hopBang">
      <table id="gvBangNv">
        <thead>
          <tr>
            <th style="width: 40px;">Xóa</th>
            <th style="width: 50px;">TT</th>
            <th style="width: 25%;">Nội dung công việc</th>
            <th style="width: 100px;">Thời gian giao</th>
            <th style="width: 120px;">Loại tiến độ</th>
            <th style="width: 100px;">Thời gian HT</th>
            <th style="width: 15%;">Người thực hiện</th>
            <th style="width: 20%;">Ghi chú</th>
          </tr>
        </thead>
        <tbody id="gvThanBang"></tbody>
      </table>
      <button class="btn btn-success nutThem" onclick="gvThemDong()">+ Thêm dòng mới</button>
    </div>

    <div class="modal fade" id="gvHopThoaiXoa" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-danger"><div class="modal-header bg-danger text-white"><h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle-fill"></i> CẢNH BÁO</h5><button type="button" class="btn-close" data-bs-dismiss="modal" onclick="gvHuyXoa()"></button></div><div class="modal-body text-center p-4"><p class="fs-6 mb-3">Bạn đang chọn <strong>XÓA TOÀN BỘ DỮ LIỆU CŨ</strong>.</p><p class="text-danger fw-bold">Hành động này sẽ xóa sạch dữ liệu hiện tại.</p></div><div class="modal-footer justify-content-center"><button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal" onclick="gvHuyXoa()">Hủy bỏ</button><button type="button" class="btn btn-danger px-4 fw-bold" onclick="gvXndongXoa()">Đồng ý Xóa</button></div></div></div>
    </div>

    <div class="modal fade" id="gvHopThoaiTb" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content shadow"><div class="modal-header text-white" id="gvDauHtTb"><h5 class="modal-title fw-bold" id="gvTdeHtTb">THÔNG BÁO</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body text-center p-4"><div id="gvBtuongHtTb" class="mb-3" style="font-size: 3rem;"></div><p class="fs-6 fw-bold" id="gvNdHtTb">...</p></div><div class="modal-footer justify-content-center"><button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Đóng</button></div></div></div>
    </div>
</div>

<script>
    let dsCanbgv = []; 
    let tdtaiXoaCho = null; 
    let ptuChoXoa = null;

    // Helper: chuyển số thành số La Mã (tối đa 3999)
    function toRoman(num) {
        const lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
        let roman = '';
        for (let i in lookup) {
            while (num >= lookup[i]) {
                roman += i;
                num -= lookup[i];
            }
        }
        return roman;
    }

    // Tự động đánh số thứ tự La Mã cho mục chính (*), số thường cho mục con
    function gvCapNhatSoThuTuTuDong() {
        const rows = document.querySelectorAll('#gvThanBang tr');
        let laMaCount = 0;
        let arabicCount = 0;
        rows.forEach(dong => {
            const ndung = dong.querySelector('.oNdGv').value.trim();
            const sttInput = dong.querySelector('.oSttGv');
            if (ndung.startsWith('*')) {
                laMaCount++;
                arabicCount = 0;
                sttInput.value = toRoman(laMaCount);
                sttInput.style.fontWeight = 'bold';
                sttInput.style.color = '#0d6efd';
            } else if (ndung !== "") {
                arabicCount++;
                sttInput.value = arabicCount;
                sttInput.style.fontWeight = 'normal';
                sttInput.style.color = '#000';
            } else {
                sttInput.value = "";
            }
        });
    }

    function gvTbaoNhanh(loai, tb) {
        const mh = document.getElementById('gvHopThoaiTb');
        const hd = document.getElementById('gvDauHtTb');
        const td = document.getElementById('gvTdeHtTb');
        const ct = document.getElementById('gvNdHtTb');
        const bg = document.getElementById('gvBtuongHtTb');
        hd.classList.remove('bg-success', 'bg-danger', 'bg-warning', 'text-dark', 'text-white'); 
        ct.innerText = tb;
        if (loai === 'tcong') { 
            hd.classList.add('bg-success', 'text-white'); 
            td.innerText = "THÀNH CÔNG"; 
            bg.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i>'; 
        } else if (loai === 'loi') { 
            hd.classList.add('bg-danger', 'text-white'); 
            td.innerText = "LỖI"; 
            bg.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i>'; 
        } else if (loai === 'cbh') { 
            hd.classList.add('bg-warning', 'text-dark'); 
            td.innerText = "CẢNH BÁO"; 
            bg.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning"></i>'; 
            hd.classList.remove('text-white'); 
        } else { 
            hd.classList.add('bg-primary', 'text-white'); 
            td.innerText = "THÔNG BÁO"; 
            bg.innerHTML = '<i class="bi bi-info-circle-fill text-primary"></i>'; 
        }
        const hm = new bootstrap.Modal(mh); 
        hm.show();
    }

    function gvDatTai(dt, tbt = null) {
        const mh = document.getElementById('gvLopPhuTai');
        const ct = document.getElementById('gvChuTai');
        const vq = mh.querySelector('.spinner-border');
        if (dt) { 
            ct.innerText = tbt || "Đang xử lý..."; 
            if (tbt && (tbt.toLowerCase().includes("nhiệm vụ chung") || tbt.toLowerCase().includes("dọn"))) { 
                ct.style.backgroundImage = "linear-gradient(45deg, #dc3545, #fd7e14, #ffc107, #dc3545)"; 
                vq.className = "spinner-border text-danger spinner-border-lg"; 
            } else { 
                ct.style.backgroundImage = "linear-gradient(45deg, #0d6efd, #6610f2, #dc3545, #0d6efd)"; 
                vq.className = "spinner-border text-primary spinner-border-lg"; 
            } 
            mh.style.display = 'flex'; 
        } else { 
            mh.style.display = 'none'; 
        }
    }

    function gvTaiCanb() { 
        gvDatTai(true, "Đang tải danh sách nhân sự..."); 
        khachApi.gvLaydsCanb(
            function(dl) { 
                dsCanbgv = dl; 
                gvLaydlGoc(); 
            }, 
            function(l) { 
                gvTbaoNhanh('loi', "Lỗi tải nhân sự: " + l.message); 
                gvDatTai(false); 
            }
        ); 
    }

    function gvLaydlGoc() { 
        gvDatTai(true, "✨ Đang cập nhật nhiệm vụ mới ✨"); 
        khachApi.gvLaydlBdau(
            gvKhiTaiXong, 
            function(l) { 
                gvTbaoNhanh('loi', "Lỗi tải dữ liệu: " + l.message); 
                gvDatTai(false); 
            }
        ); 
    }

    // Định dạng ngày dd/mm/yyyy khi nhập
    function gvDinhDangNgay(ptu, e) {
        if (e && (e.which === 8 || e.which === 46)) return;
        let v = ptu.value.replace(/\D/g, ''); 
        if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
        if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
        ptu.value = v;
    }

    // Tự động điều chỉnh chiều cao textarea
    function gvCoDan(ptu) { 
        ptu.style.height = 'auto'; 
        ptu.style.height = (ptu.scrollHeight) + 'px'; 
    }

    // Vẽ một dòng trên bảng (nhận đúng 13 cột từ server)
    function gvVeDong(dong = null) {
        const tb = document.getElementById('gvThanBang');
        const tr = document.createElement('tr');
        
        // Giá trị mặc định cho dòng mới
        let sttVal = "", ndVal = "", tgGiaoVal = "", loaiTDVal = "", tgHTVal = "", nguoiVal = "", ghichuVal = "";
        let isDisabled = false; // disabled khi đã có người nhận (dữ liệu cũ)
        
        if (dong) {
            // dong là mảng 13 phần tử từ server
            sttVal      = dong[0] || "";
            ndVal       = dong[1] || "";
            // dong[2] là Điểm tối đa (chỉ đọc, không dùng trong giao diện chính)
            tgGiaoVal   = dong[3] || "";   // Thời gian giao
            loaiTDVal   = dong[4] || "";   // Loại tiến độ
            tgHTVal     = dong[5] || "";   // Thời gian hoàn thành
            nguoiVal    = dong[6] || "";   // Người thực hiện (có thể là -TOÀN TRƯỜNG- hoặc tên sheet)
            ghichuVal   = dong[8] || "";
            // Nếu dữ liệu đã có người nhận (không rỗng) thì khoá select không cho sửa
            if (nguoiVal && nguoiVal.trim() !== "") isDisabled = true;
        }
        
        // Nút xóa: chỉ xuất hiện khi dòng mới thêm (dong == null)
        let btnXoa = dong ? `<i class="bi bi-lock-fill text-secondary" title="Đã lưu, không thể xoá"></i>` 
                         : `<button class="btn btn-danger btn-sm p-0" style="width:24px; height:24px; line-height:20px;" onclick="gvXoaDong(this)">X</button>`;
        
        // Tạo dropdown người thực hiện
        let lchon = `<option value="">--Chọn--</option>`;
        // Thêm tuỳ chọn TOÀN TRƯỜNG nếu dòng chưa bị khoá hoặc là ALL
        if (!isDisabled || nguoiVal.toUpperCase() === '-TOÀN TRƯỜNG-') {
            let selectedAll = (nguoiVal.toUpperCase() === '-TOÀN TRƯỜNG-') ? "selected" : "";
            lchon += `<option value="ALL" style="font-weight:bold; color:blue;" ${selectedAll}>-TOÀN TRƯỜNG-</option>`;
        }
        dsCanbgv.forEach(s => { 
            let selected = (nguoiVal === s.ttrg || nguoiVal === s.tenn) ? "selected" : "";
            lchon += `<option value="${s.ttrg}" data-name="${s.tenn}" ${selected}>${s.tenn}</option>`;
        });
        
        // Loại tiến độ: chỉ có "Cho vượt tiến độ" hoặc rỗng
        let cv = (loaiTDVal === "Cho vượt tiến độ") ? "selected" : "";
        
        tr.innerHTML = `
            <td class="oHdong">${btnXoa}</td>
            <td class="text-center"><input type="text" class="form-control text-center oSttGv" value="${sttVal}" readonly style="background:#f0f0f0;"></td>
            <td><textarea class="form-control oNdGv" placeholder="Nhập nội dung..." rows="1" oninput="gvCoDan(this); gvCapNhatSoThuTuTuDong()" onfocus="gvCoDan(this)"></textarea></td>
            <td><input type="text" class="form-control text-center oTgGiao" placeholder="dd/mm/yyyy" onkeyup="gvDinhDangNgay(this, event)"></td>
            <td><select class="form-select text-center oLoaiTD"><option value="">--Chọn--</option><option value="Cho vượt tiến độ" ${cv}>Cho vượt tiến độ</option></select></td>
            <td><input type="text" class="form-control text-center oTgHT" placeholder="dd/mm/yyyy" onkeyup="gvDinhDangNgay(this, event)"></td>
            <td><select class="form-select oNguoiTH" ${isDisabled ? 'disabled' : ''}>${lchon}</select></td>
            <td><textarea class="form-control text-center oGchuGv" placeholder="Ghi chú" rows="1" oninput="gvCoDan(this)" onfocus="gvCoDan(this)"></textarea></td>
        `;
        
        // Gán giá trị cho các field
        tr.querySelector('.oNdGv').value = ndVal;
        tr.querySelector('.oTgGiao').value = tgGiaoVal;
        tr.querySelector('.oTgHT').value = tgHTVal;
        tr.querySelector('.oGchuGv').value = ghichuVal;
        
        tb.appendChild(tr);
    }
    
    // Thêm dòng mới (trống)
    function gvThemDong() { 
        gvVeDong(null); 
        gvCapNhatSoThuTuTuDong();
    }
    
    // Xóa dòng (chỉ cho dòng mới thêm)
    function gvXoaDong(btn) { 
        btn.closest('tr').remove(); 
        gvCapNhatSoThuTuTuDong();
    }
    
    // Khi chọn người thực hiện (gửi dữ liệu lên server cho dòng đơn)
    function gvDoiNgn(selectEl) {
        const dong = selectEl.closest('tr'); 
        const ndg = dong.querySelector('.oNdGv').value.trim();
        if (!ndg) { 
            gvTbaoNhanh('cbh', "Nội dung công việc không được để trống!"); 
            selectEl.value = ""; 
            return; 
        }
        const gt = selectEl.value; 
        if (!gt) return; 
        
        const gth = gt.toUpperCase();
        const nm = document.getElementById('gvLocNam').value; 
        const thang = document.getElementById('gvLocThang').value;
        
        let tenNguoiNhan = "";
        if (gth !== 'ALL') {
            tenNguoiNhan = selectEl.options[selectEl.selectedIndex]?.getAttribute('data-name') || "";
        } else {
            tenNguoiNhan = "TOÀN TRƯỜNG";
        }
        
        // Lấy các giá trị từ dòng
        const sttVal = dong.querySelector('.oSttGv').value;
        const tgGiao = dong.querySelector('.oTgGiao').value;
        const loaiTD = dong.querySelector('.oLoaiTD').value;
        const tgHT = dong.querySelector('.oTgHT').value;
        const ghichu = dong.querySelector('.oGchuGv').value;
        
        const nvx = { 
            stt: sttVal,
            ndung: ndg,
            tggiao: tgGiao,
            tdo: loaiTD,
            tght: tgHT,
            gchu: ghichu,
            ngnhan: gt,
            trangngnhan: gt,
            tenngnhan: tenNguoiNhan,
            // Các trường J-M mặc định để trống (server sẽ kế thừa nếu cần)
            colJ: "", colK: "", colL: "", colM: ""
        };
        
        gvDatTai(true, (gth === 'ALL') ? "🚀 Đang giao cho TOÀN TRƯỜNG 🚀" : "⏳ Đang gửi cho " + tenNguoiNhan + "...");
        gvGoiMayChu(nm, thang, nvx, selectEl, null);
    }
    
    // Cập nhật toàn bộ nhiệm vụ (nút "Cập nhật nhiệm vụ chung")
    function gvCapNhatNhiemVuChung() {
        const nm = document.getElementById('gvLocNam').value;
        const thang = document.getElementById('gvLocThang').value;
        let dsNviec = [];
        const rows = document.querySelectorAll('#gvThanBang tr');
        for (let dong of rows) {
            const ndg = dong.querySelector('.oNdGv').value.trim();
            if (ndg === "") continue;
            const selectNgn = dong.querySelector('.oNguoiTH');
            let tenNguoiNhan = "";
            if (selectNgn && selectNgn.selectedIndex >= 0) {
                tenNguoiNhan = selectNgn.options[selectNgn.selectedIndex]?.getAttribute('data-name') || "";
            }
            dsNviec.push({
                stt: dong.querySelector('.oSttGv').value,
                ndung: ndg,
                tggiao: dong.querySelector('.oTgGiao').value,
                tdo: dong.querySelector('.oLoaiTD').value,
                tght: dong.querySelector('.oTgHT').value,
                gchu: dong.querySelector('.oGchuGv').value,
                ngnhan: selectNgn.value,
                trangngnhan: selectNgn.value,
                tenngnhan: tenNguoiNhan,
                colJ: "", colK: "", colL: "", colM: ""
            });
        }
        if (dsNviec.length === 0) {
            gvTbaoNhanh('cbh', "Không có nhiệm vụ nào để cập nhật!");
            return;
        }
        gvDatTai(true, "⏳ Đang cập nhật toàn bộ nhiệm vụ...");
        khachApi.gvXulyNviec({ nam: nm, thang: thang, nviec: { batch: true, ds: dsNviec } }, function(kq) {
            gvDatTai(false);
            if (kq && kq.ttai === 'tcong') {
                gvTbaoNhanh('tcong', kq.tbao);
                setTimeout(gvLaydlGoc, 1000);
            } else {
                gvTbaoNhanh('loi', "Lỗi Server: " + (kq ? kq.tbao : "Unknown"));
            }
        }, function(l) {
            gvDatTai(false);
            gvTbaoNhanh('loi', "Lỗi kết nối: " + l.message);
        });
    }
    
    // Xử lý chuyển tháng: gửi lệnh DELETE lên server
    function gvXlmChth(btn) {
        const nm = document.getElementById('gvLocNam').value;
        const oThang = document.getElementById('gvLocThang');
        const vtThang = oThang.selectedIndex;
        const thangCu = oThang.value;
        if (vtThang < oThang.options.length - 1) {
            oThang.selectedIndex = vtThang + 1;
        } else {
            oThang.selectedIndex = 0;
        }
        const thangMoi = oThang.value;
        const nvx = { ngnhan: "DELETE" };
        tdtaiXoaCho = { nam: nm, thang: thangMoi, nviec: nvx, thangCu: thangCu };
        ptuChoXoa = btn;
        const hmc = new bootstrap.Modal(document.getElementById('gvHopThoaiXoa'));
        hmc.show();
    }
    
    function gvXndongXoa() {
        const modal = bootstrap.Modal.getInstance(document.getElementById('gvHopThoaiXoa'));
        modal.hide();
        if (tdtaiXoaCho && ptuChoXoa) {
            const { nam, thang, nviec } = tdtaiXoaCho;
            gvDatTai(true, `🧹 Đang làm sạch dữ liệu và cập nhật sang ${thang}`);
            gvGoiMayChu(nam, thang, nviec, ptuChoXoa, 'DELETE');
        }
    }
    
    function gvHuyXoa() {
        if (ptuChoXoa && ptuChoXoa.tagName !== 'BUTTON') {
            ptuChoXoa.value = "";
        }
        if (tdtaiXoaCho && tdtaiXoaCho.thangCu) {
            document.getElementById('gvLocThang').value = tdtaiXoaCho.thangCu;
        }
        tdtaiXoaCho = null;
        ptuChoXoa = null;
    }
    
    // Hàm gọi API chung
    function gvGoiMayChu(n, t, nv, ptu, action) {
        khachApi.gvXulyNviec(
            { nam: n, thang: t, nviec: nv },
            function(kq) {
                gvDatTai(false);
                if (kq && kq.ttai === 'tcong') {
                    if (action === 'DELETE') {
                        tdtaiXoaCho = null;
                        ptuChoXoa = null;
                        setTimeout(gvLaydlGoc, 1000);
                    } else {
                        // Đánh dấu thành công
                        ptu.style.backgroundColor = '#d1e7dd';
                        ptu.style.borderColor = '#badbcc';
                        ptu.style.fontWeight = 'bold';
                        // Tải lại dữ liệu để cập nhật trạng thái khoá
                        setTimeout(gvLaydlGoc, 800);
                    }
                } else {
                    gvTbaoNhanh('loi', "Lỗi Server: " + (kq ? kq.tbao : "Unknown"));
                    if (ptu.tagName !== 'BUTTON') ptu.value = "";
                }
            },
            function(l) {
                gvDatTai(false);
                gvTbaoNhanh('loi', "Lỗi kết nối: " + l.message);
            }
        );
    }
    
    // Hàm xử lý khi tải dữ liệu thành công từ server
    function gvKhiTaiXong(dl) {
        gvDatTai(false);
        // Cập nhật năm học và tháng
        let namValue = dl.nam;
        const inputNam = document.getElementById('gvLocNam');
        if (namValue && namValue.trim() !== "") {
            inputNam.value = namValue;
        } else {
            inputNam.value = "";
            gvTbaoNhanh('cbh', "Ô C7 sheet GIAOVIEC chưa có dữ liệu năm học.");
        }
        if (dl.thang) document.getElementById('gvLocThang').value = dl.thang;
        
        const bns = dl.dlbang; // mảng các dòng, mỗi dòng 13 phần tử
        const tb = document.getElementById('gvThanBang');
        tb.innerHTML = "";
        if (bns && bns.length > 0) {
            bns.forEach(dong => gvVeDong(dong));
            setTimeout(() => {
                document.querySelectorAll('#khuGvChinh textarea.form-control').forEach(ptu => gvCoDan(ptu));
                gvCapNhatSoThuTuTuDong();
                // Nếu ở chế độ chỉ đọc
                const isReadonlyMode = (window.PGV_GIAO_VIEC_READONLY === true);
                if (isReadonlyMode) {
                    document.querySelectorAll('#gvBangNv select.oNguoiTH').forEach(sel => sel.disabled = true);
                    document.querySelectorAll('#gvBangNv input.oSttGv').forEach(inp => inp.readOnly = true);
                }
            }, 300);
        } else {
            gvVeDong(); // một dòng trống
        }
        
        // Xử lý hiển thị nút theo quyền
        let quyen = '';
        if (typeof canbHientai !== 'undefined' && canbHientai.quyen) {
            quyen = canbHientai.quyen;
        } else if (window.PGV_COT_E) {
            quyen = window.PGV_COT_E;
        }
        const btnChung = document.getElementById('btnCapNhatChung');
        const btnChuyenThang = document.getElementById('gvNutChth');
        const isAdmin = (typeof canbHientai !== 'undefined' && canbHientai.qchon === true);
        if (quyen === 'x') {
            if (btnChung) btnChung.style.display = 'none';
            if (btnChuyenThang) btnChuyenThang.style.display = 'none';
        } else if (quyen === 'xx') {
            if (btnChung) btnChung.style.display = 'none';
            if (btnChuyenThang) btnChuyenThang.style.display = 'flex';
        } else {
            if (btnChung) btnChung.style.display = isAdmin ? 'inline-block' : 'none';
            if (btnChuyenThang) btnChuyenThang.style.display = isAdmin ? 'flex' : 'none';
        }
    }
    
    // Bắt đầu tải dữ liệu
    setTimeout(function() { 
        gvTaiCanb(); 
    }, 500);
</script>
