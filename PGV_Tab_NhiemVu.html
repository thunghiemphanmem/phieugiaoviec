<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nhiệm vụ của tôi - Bảng đánh giá (Đúng chuẩn nhiều ràng buộc)</title>
    <!-- Bootstrap 5 Icons & CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
      .hopDau { background-color: #e9ecef; padding: 5px 10px; border-radius: 5px; margin-bottom: 5px; border: 1px solid #ced4da; }
      .tDe { font-weight: bold; color: #dc3545; font-size: 20px; text-transform: uppercase; margin: 0; }
      .nhanNhiemVu { font-weight: bold; color: #333; font-size: 14px; }
      .chuThongTin { font-weight: bold; color: #0d6efd; font-size: 15px; margin-left: 5px; }
      .nhapTuyChinh { border: 1px solid #ced4da; border-radius: 4px; padding: 2px; outline: none; height: 30px; font-size: 14px; }
      .epMotDong { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }

      #bangNviec { table-layout: fixed; width: 100%; word-wrap: break-word; border-collapse: collapse; border: none; }
      #bangNviec thead th { position: sticky; top: 0; z-index: 10; background-color: #0d6efd !important; color: white !important; vertical-align: middle; text-align: center; padding: 8px 5px; font-size: 13px; border: none; border-right: 1px solid #7ea8f8;}
      #bangNviec th:last-child { border-right: none; }
      #bangNviec td { vertical-align: middle !important; padding: 0 !important; border: none !important; border-bottom: 1px dashed #dee2e6 !important; border-right: 1px solid #dee2e6 !important; overflow: hidden; }
      #bangNviec td:last-child { border-right: none !important; }

      #bangNviec select.form-select.chonKq,
      #bangNviec input.chonKq {
          border: 1px solid #adb5bd !important;
          background-color: #ffffff !important;
          border-radius: 6px !important;
          padding: 5px 8px !important;
          width: 100% !important;
          font-weight: 500 !important;
          cursor: pointer;
      }
      #bangNviec select.chonKq option {
          white-space: normal !important;
          word-break: break-word !important;
          padding: 6px 8px !important;
          max-width: 280px;
      }
      .diemCong, .diemCong:disabled { background-color: #0d6efd !important; color: white !important; }
      .diemTru, .diemTru:disabled { background-color: #dc3545 !important; color: white !important; }
      .diemKhong, .diemKhong:disabled { background-color: #28a745 !important; color: black !important; }
      button:disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
<div class="container-fluid p-2">
<div class="hopDau">
  <div class="d-flex align-items-center mb-1">
    <div class="text-nowrap" style="flex:1.5"><span class="nhanNhiemVu">Thời gian:</span><span id="chuThoiGian" class="chuThongTin">23/05/2025</span>
      <span class="nhanNhiemVu border-start ps-3">Năm học:</span><span id="chuNamHoc" class="chuThongTin">2024-2025</span></div>
    <div class="tDe text-center" style="flex:2">NHIỆM VỤ CỦA TÔI</div>
    <div class="text-end" style="flex:2">
      <div class="d-inline-block pe-3 me-2"><label class="me-1 fw-bold">Điểm cộng/trừ:</label>
        <input type="number" id="nhapDiemThuong" oninput="capnhTdong()" class="nhapTuyChinh text-center diemKhong" style="width:50px" value="0"></div>
      <div class="d-inline-block"><label class="me-1 fw-bold text-danger">Kết quả:</label><span id="chuKqHthi" class="fw-bold text-danger">Chưa đánh giá</span></div>
    </div>
  </div>
  <div class="d-flex align-items-center mb-2 px-2 py-1 gap-2 flex-wrap" style="background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px">
     <div><span class="nhanNhiemVu me-2">Số ngày nghỉ:</span><input type="number" id="nhapSngayNghi" class="nhapTuyChinh text-center" style="width:45px" placeholder="0">
         <textarea id="nhapLdoNghi" placeholder="Lý do..." style="height:30px; width:260px; font-size:13px; border-radius:4px; resize:none"></textarea></div>
     <div class="ms-auto"><select id="hopChonGv" class="form-select-sm border-primary" style="display:none"><option>-- GV --</option></select>
        <button id="nutLuuTam" class="btn btn-success btn-sm" onclick="xulyLuuTam()"><i class="bi bi-save"></i> Lưu nhật ký</button>
        <button id="nutNopBcao" class="btn btn-primary btn-sm" onclick="nopBcaoChinh()" disabled><i class="bi bi-send"></i> Nộp báo cáo</button></div>
  </div>
  <div class="row g-1">
    <div class="col-md-6"><textarea id="nhapYkien" class="form-control border-danger" placeholder="* Ý kiến tham mưu..." style="height:45px"></textarea></div>
    <div class="col-md-6"><textarea id="nhapBcao" class="form-control border-danger" placeholder="* Báo cáo tóm tắt..." style="height:45px"></textarea></div>
  </div>
</div>
<div class="card shadow-sm">
  <div class="table-responsive" style="max-height:65vh; overflow-y:auto">
    <table class="table table-hover mb-0" id="bangNviec">
      <thead><tr><th style="width:3%">TT</th><th style="width:32%">Nội dung công việc</th><th style="width:8%">Điểm Max</th><th style="width:12%">TG Giao</th><th style="width:10%">Tiến độ</th><th style="width:12%">TG Hoàn thành</th><th style="width:20%">Điểm đánh giá</th><th style="width:3%">Xoá</th></tr></thead>
      <tbody></tbody>
     </table>
  </div>
  <div class="p-2 bg-light border-top"><button class="btn btn-sm btn-outline-primary" onclick="addNv()"><i class="bi bi-plus-circle"></i> Thêm nhiệm vụ</button></div>
</div>
</div>

<script>
// ########################### DỮ LIỆU MẪU CÓ NHIỀU RÀNG BUỘC PHỨC HỢP (>=, >=) ###########################
// Mô phỏng dữ liệu từ server: mỗi dòng có các cột ẩn oColJ, oColK, oColL, oColM chứa chuỗi điều kiện.
// Ví dụ: "10" (một ràng buộc), ">=5, >=5" (hai ràng buộc), ">=6 >=4" (cũng hai ràng buộc)
const duLieuMau = [
    ["1", "* Về phẩm chất chính trị, đạo đức, lối sống (30 điểm)", "30", "01/09/2024", "Đúng tiến độ", "", "", "10||10", "Ghi chú A", "10", ">=5, >=5", ">=4", ""],
    ["2", "Việc thực hiện quy chế làm việc, nguyên tắc dân chủ", "10", "01/09/2024", "Đúng tiến độ", "", "", "10|10|8|6|4|0", "Ghi chú B", "10", ">=5 >=5", ">=4", ""],
    ["3", "Xây dựng mối đoàn kết nội bộ", "10", "01/09/2024", "Đúng tiến độ", "", "", "10|10|8|6|4|0", "Ghi chú C", "10", ">=5", ">=5, >=5", ""],
    ["4", "Công tác giảng dạy", "10", "01/09/2024", "Vượt tiến độ", "", "", "10|Xuất sắc (10)|8|Tốt (8)|6|Khá (6)|4|TB (4)|0|Kém", "Ghi chú D", "10", ">=6", ">=4", ""],
    ["5", "Tỷ lệ chuyên cần học sinh", "10", "01/09/2024", "Vượt tiến độ", "", "", "10|100% (10)|8|>=98% (8)|6|<98% (6)|4|<90% (4)|0|<80%", "Ghi chú E", "10", ">=8", ">=4", ""],
    ["6", "Chất lượng học sinh", "10", "01/09/2024", "Vượt tiến độ", "", "", "10|Xuất sắc (10)|8|Tốt (8)|6|Khá (6)|4|TB (4)|0|Kém", "Ghi chú F", "10", ">=6", ">=4", ""],
    ["7", "Hồ sơ chuyên môn", "10", "01/09/2024", "Vượt tiến độ", "", "", "10|Xuất sắc (10)|8|Tốt (8)|6|Khá (6)|4|TB (4)|0|Kém", "Ghi chú G", "10", ">=6", ">=4", ""],
    ["8", "Chấp hành giờ giấc", "10", "01/09/2024", "Vượt tiến độ", "", "", "8|Tốt (8)|6|Khá (6)|4|TB (4)|0|Kém", "Ghi chú H", "", ">=6", ">=4", ">=4"],
    ["9", "Các nhiệm vụ kiêm nhiệm", "10", "01/09/2024", "Vượt tiến độ", "", "", "10|Xuất sắc (10)|8|Tốt (8)|6|Khá (6)|4|TB (4)|0|Kém", "Ghi chú I", ">=8", ">=6", ">=4", ""],
    ["10", "Nhiệm vụ khác (kiểm tra ràng buộc kép)", "10", "01/09/2024", "Đúng hạn", "", "", "10|Xuất sắc (10)|8|Tốt (8)|6|Khá (6)|4|TB (4)|0|Kém", "", "", ">=6, >=4", ">=4", ">=1"]
];

// Hàm hiển thị bảng với dữ liệu mẫu (mô phỏng khachApi)
function taiDlBdau() {
    veBangNviec(duLieuMau);
}

// Các biến toàn cục (giả lập môi trường)
window.PGV_IS_SELF = true;
window.PGV_CAN_SHOW_DELETE_BUTTON = true;
function hienThongb(type, msg, callback) { alert(msg); if(callback) callback(); }
function hienTaiDl(msg) { console.log(msg); }
function anTaiDl() {}
function capnhTdong() { tinhtTdong(); }
function xulyTaiBcao() {}
window.tepdinhkBcao = [];

// ================== LOGIC XẾP LOẠI CHÍNH XÁC: XÉT TẤT CẢ RÀNG BUỘC TRONG CỘT ==================
function kiemTraTatCaRangBuoc(giaTriThuc, chuoiDieuKien) {
    if (!chuoiDieuKien || chuoiDieuKien.trim() === "") return false;
    let str = chuoiDieuKien.trim();
    let constraints = [];
    if (str.includes(',')) constraints = str.split(',').map(s=>s.trim()).filter(s=>s);
    else if (str.includes(' ')) constraints = str.split(/\s+/).filter(s=>s);
    else constraints = [str];
    if (constraints.length === 0) return false;
    let numVal = parseFloat(String(giaTriThuc).replace(/[^\d.-]/g, ''));
    if (isNaN(numVal)) return false;
    for (let cond of constraints) {
        if (cond.startsWith(">=")) {
            let threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal >= threshold)) return false;
        } else if (cond.startsWith("<=")) {
            let threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal <= threshold)) return false;
        } else if (cond.startsWith(">") && !cond.startsWith(">=")) {
            let threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal > threshold)) return false;
        } else if (cond.startsWith("<") && !cond.startsWith("<=")) {
            let threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal < threshold)) return false;
        } else {
            let exact = parseFloat(cond.replace(/[^\d.-]/g, ''));
            if (isNaN(exact)) return false;
            if (Math.abs(numVal - exact) > 1e-9) return false;
        }
    }
    return true;
}

function tinhtTdong() {
    let dc = parseFloat(document.getElementById('nhapDiemThuong').value) || 0;
    let tongDiem = 0, tongMax = 0, soNhiemVu = 0, soDaDanhGia = 0;
    let minRank = 5; // 5: chưa xếp, 4 XS, 3 HTT, 2 HT, 1 CHT
    let hasJMLogic = false;

    document.querySelectorAll('#bangNviec tbody tr.dongNv').forEach(row => {
        const cg = row.querySelector('.chonKq');
        if (cg && cg.style.display !== 'none') {
            soNhiemVu++;
            let maxInput = row.querySelector('.nhapDiemMax');
            if (maxInput && maxInput.value) {
                let maxVal = parseFloat(maxInput.value);
                if (!isNaN(maxVal)) tongMax += maxVal;
            }
            if (cg.value !== "") {
                soDaDanhGia++;
                let valThuc = cg.value.trim();
                let diem = parseFloat(valThuc.replace(/[^\d.-]/g, ''));
                if (!isNaN(diem)) tongDiem += diem;

                let j = row.querySelector('.oColJ')?.value.trim() || "";
                let k = row.querySelector('.oColK')?.value.trim() || "";
                let l = row.querySelector('.oColL')?.value.trim() || "";
                let m = row.querySelector('.oColM')?.value.trim() || "";

                if (j !== "" || k !== "" || l !== "" || m !== "") {
                    hasJMLogic = true;
                    let rank = 0;
                    if (kiemTraTatCaRangBuoc(valThuc, j)) rank = 4;
                    else if (kiemTraTatCaRangBuoc(valThuc, k)) rank = 3;
                    else if (kiemTraTatCaRangBuoc(valThuc, l)) rank = 2;
                    else if (kiemTraTatCaRangBuoc(valThuc, m)) rank = 1;
                    if (rank > 0) minRank = Math.min(minRank, rank);
                    else minRank = Math.min(minRank, 1);
                }
            }
        }
    });

    let diemCuoi = tongDiem + dc;
    let xepLoai = "Chưa hoàn thành";
    if (soNhiemVu === 0) xepLoai = "Chưa giao việc";
    else if (soDaDanhGia === 0) xepLoai = "Chưa đánh giá";
    else {
        if (hasJMLogic) {
            if (minRank === 4) xepLoai = "Xuất sắc";
            else if (minRank === 3) xepLoai = "Hoàn thành tốt";
            else if (minRank === 2) xepLoai = "Hoàn thành";
            else if (minRank === 1) xepLoai = "Chưa hoàn thành";
            else xepLoai = "Chưa xác định";
        } else {
            let tyLe = tongMax > 0 ? (diemCuoi / tongMax) * 100 : diemCuoi;
            if (tyLe >= 90) xepLoai = "Xuất sắc";
            else if (tyLe >= 70) xepLoai = "Hoàn thành tốt";
            else if (tyLe >= 50) xepLoai = "Hoàn thành";
            else xepLoai = "Chưa hoàn thành";
        }
    }
    let hienThi = xepLoai;
    if (xepLoai !== "Chưa giao việc" && xepLoai !== "Chưa đánh giá" && (tongDiem > 0 || dc !== 0 || !hasJMLogic))
        hienThi = `${xepLoai}: ${diemCuoi} điểm`;
    document.getElementById('chuKqHthi').innerText = hienThi;
}

// Vẽ bảng từ dữ liệu (có hỗ trợ dropdown với nhiều lựa chọn)
function veBangNviec(db) {
    let tbody = $('#bangNviec tbody').empty();
    if (!db || db.length === 0) {
        tbody.append('<tr><td colspan="8" class="text-center text-muted">Chưa có nhiệm vụ</td></tr>');
        tinhtTdong(); return;
    }
    db.forEach((row, idx) => {
        let stt = row[0] || (idx+1);
        let nd = row[1] || "";
        let dMax = row[2] || "";
        let tgGiao = row[3] || "";
        let tienDo = row[4] || "";
        let tgHt = row[5] || "";
        let configRaw = row[7] || "";   // cấu hình dropdown: "value|text|value|text..."
        let jVal = row[9] || "";
        let kVal = row[10] || "";
        let lVal = row[11] || "";
        let mVal = row[12] || "";
        let valChon = "";
        let htmlDiem = `<input type="text" class="form-control form-control-sm text-center chonKq" data-config="${configRaw}" value="${valChon}" onchange="tinhtTdong()">`;
        if (configRaw.includes("|")) {
            let parts = configRaw.split("|");
            htmlDiem = `<select class="form-select form-select-sm chonKq" data-config="${configRaw}" onchange="tinhtTdong()"><option value="">-- Trống --</option>`;
            for (let i=0; i<parts.length; i+=2) {
                let val = parts[i];
                let txt = parts[i+1] || val;
                htmlDiem += `<option value="${val}">${txt}</option>`;
            }
            htmlDiem += `</select>`;
        }
        let nutXoa = `<button class="btn btn-sm btn-danger py-0 px-2" onclick="xoaDongNv(this)">✕</button>`;
        let dong = `<tr class="dongNv">
            <td class="text-center oStt">${stt}</td>
            <td><textarea class="form-control nhapNdung" readonly rows="1">${nd}</textarea>
                <input type="hidden" class="oColJ" value="${jVal}"><input type="hidden" class="oColK" value="${kVal}">
                <input type="hidden" class="oColL" value="${lVal}"><input type="hidden" class="oColM" value="${mVal}">
            </td>
            <td><input class="form-control text-center nhapDiemMax" value="${dMax}" readonly></td>
            <td><input class="form-control text-center nhapTgGiao" value="${tgGiao}" readonly></td>
            <td><input class="form-control text-center nhapTdo" value="${tienDo}" readonly></td>
            <td><input class="form-control text-center nhapTgHt" placeholder="dd/mm/yyyy" value="${tgHt}"></td>
            <td>${htmlDiem}</td>
            <td class="text-center">${nutXoa}</td>
        </tr>`;
        tbody.append(dong);
    });
    tinhtTdong();
}

function addNv() {
    let newRow = `<tr class="dongNv">
        <td class="text-center oStt"></td>
        <td><textarea class="form-control nhapNdung" rows="1" placeholder="Nội dung..."></textarea>
            <input type="hidden" class="oColJ"><input type="hidden" class="oColK">
            <input type="hidden" class="oColL"><input type="hidden" class="oColM">
        </td>
        <td><input class="form-control text-center nhapDiemMax"></td>
        <td><input class="form-control text-center nhapTgGiao" placeholder="dd/mm/yyyy"></td>
        <td><input class="form-control text-center nhapTdo"></td>
        <td><input class="form-control text-center nhapTgHt" placeholder="dd/mm/yyyy"></td>
        <td><input type="text" class="form-control text-center chonKq" data-config="" onchange="tinhtTdong()"></td>
        <td class="text-center"><button class="btn btn-sm btn-danger py-0 px-2" onclick="xoaDongNv(this)">✕</button></td>
    </tr>`;
    $('#bangNviec tbody').append(newRow);
    tinhtTdong();
}
function xoaDongNv(btn) { $(btn).closest('tr').remove(); tinhtTdong(); }
function xulyLuuTam() { alert("Mô phỏng lưu thành công!"); }
function nopBcaoChinh() { alert("Mô phỏng nộp báo cáo!"); }

// Khởi tạo dữ liệu mẫu
$(document).ready(function() {
    taiDlBdau();
});
</script>
</body>
