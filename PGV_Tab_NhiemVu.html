<script>
// Biến lưu danh sách file đính kèm (chỉ lưu tên file, không lưu base64)
window.dsFileDinhKem = window.dsFileDinhKem || [];

let mbcMo = false; let cotETonTai = false; let giaTriCotE = ""; let dsGiaoVien = [];

function kiemTraLaBGH() {
    if (typeof window.PGV_QUYEN !== 'undefined' && (window.PGV_QUYEN === 'xxx' || window.PGV_QUYEN === 'xx')) return true;
    if (typeof canbHientai !== 'undefined' && (canbHientai.quyen === 'xxx' || canbHientai.quyen === 'xx')) return true;
    return false;
}

function kiemTraQuyenTruyCap() {
    var selectGv = document.getElementById("hopChonGv"); 
    var nutLuu = document.getElementById("nutLuuTam"); 
    var nutNop = document.getElementById("nutNopBcao");
    var diemThuong = document.getElementById("nhapDiemThuong");
    var isBGH = kiemTraLaBGH();

    if (cotETonTai && selectGv && selectGv.style.display !== "none") {
        var daChon = selectGv.value && selectGv.value !== "";
        if (daChon) { 
            if (isBGH) {
                if (nutLuu) nutLuu.disabled = false; 
                if (diemThuong) diemThuong.disabled = false;
                if (nutNop) nutNop.disabled = true; 
            } else {
                if (nutLuu) nutLuu.disabled = true; 
                if (nutNop) nutNop.disabled = true; 
                if (diemThuong) diemThuong.disabled = true;
                if (typeof hienThongb === 'function') hienThongb('chuy', '⚠️ Bạn đang xem nhật ký của giáo viên khác. Chỉ giáo viên đó hoặc Ban Giám hiệu mới được lưu.'); 
            }
        } else { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        }
    } else { 
        if (window.PGV_IS_SELF || isBGH) { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        } 
    }
}

function khoiTaoDropdownGiaoVien(danhSachGiaoVien) {
    var selectGv = document.getElementById("hopChonGv"); if (!selectGv) return;
    selectGv.innerHTML = '<option value="">-- Lựa chọn giáo viên --</option>';
    if (danhSachGiaoVien && danhSachGiaoVien.length > 0) { danhSachGiaoVien.forEach(function(gv) { var option = document.createElement("option"); option.value = gv.id || gv.ma || gv.ttrg; option.textContent = gv.ten || gv.hoTen || gv.tenn; selectGv.appendChild(option); }); selectGv.style.display = "inline-block"; selectGv.disabled = false; } 
    else { selectGv.style.display = "none"; selectGv.disabled = true; }
}

function xuLyCotE(giaTriE, danhSachGiaoVien) { 
    cotETonTai = true; giaTriCotE = giaTriE; dsGiaoVien = danhSachGiaoVien || []; 
    khoiTaoDropdownGiaoVien(dsGiaoVien); 
    kiemTraQuyenTruyCap(); 
}

function cdang(ptu) { 
    if(!ptu) return;
    ptu.style.height = 'auto'; 
    ptu.style.height = (ptu.scrollHeight) + 'px'; 
}
function gdang(ptu) { ptu.style.height = 'auto'; ptu.style.height = ptu.scrollHeight + 'px'; }
function cgon(ptu, ccao) { ptu.style.height = ccao; ptu.scrollTop = 0; }

// Hàm tạo chuỗi báo cáo (chỉ lưu tên file, không lưu nội dung base64)
function maHoaBcao(chu, dsFile) { 
    let q = (chu || "").trim(); 
    if (dsFile && dsFile.length > 0) { 
        dsFile.forEach(function(f) { 
            q += ' [FILE:' + f.tentep + ']'; 
        }); 
    } 
    return q; 
}

// ==================== XỬ LÝ FILE ĐÍNH KÈM (KHÔNG NHÚNG BASE64) ====================
function xulyTaiBcao(input) {
    if (!input.files || input.files.length === 0) return;
    
    var vungDinhk = document.getElementById('vungDinhkBcao');
    if (!vungDinhk) return;
    
    for (var i = 0; i < input.files.length; i++) {
        var file = input.files[i];
        var fileName = file.name;
        
        // Kiểm tra trùng tên file
        var isDuplicate = window.dsFileDinhKem.some(function(f) { return f.tentep === fileName; });
        if (isDuplicate) {
            if (typeof hienThongb === 'function') {
                hienThongb('cbh', 'File "' + fileName + '" đã được đính kèm trước đó!');
            } else {
                alert('File "' + fileName + '" đã được đính kèm trước đó!');
            }
            continue;
        }
        
        // Chỉ lưu thông tin file, KHÔNG đọc base64
        var fileInfo = {
            tentep: fileName,
            loai: file.type,
            kichthuoc: file.size,
            thoiGian: new Date().toISOString()
        };
        
        window.dsFileDinhKem.push(fileInfo);
        hienThiFileDinhKem(fileInfo, vungDinhk);
        
        // Thông báo chỉ lưu tên file (không upload trực tiếp lên server ở đây)
        if (typeof hienThongb === 'function') {
            hienThongb('chuy', 'Đã thêm file "' + fileName + '". Lưu ý: File sẽ chỉ được ghi nhận tên, không upload nội dung lên server.');
        }
    }
    
    input.value = '';
}

function hienThiFileDinhKem(fileData, container) {
    var badge = document.createElement('span');
    badge.className = 'file-badge';
    badge.setAttribute('data-filename', fileData.tentep);
    
    var sizeText = '';
    if (fileData.kichthuoc) {
        var kb = Math.round(fileData.kichthuoc / 1024);
        sizeText = kb > 0 ? ' (' + kb + 'KB)' : '';
    }
    
    badge.innerHTML = '<i class="bi bi-paperclip"></i>' +
        '<span style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="' + fileData.tentep + '">' + fileData.tentep + sizeText + '</span>' +
        '<span class="btn-close btn-close-sm" onclick="xoaFileDinhKem(this)" style="font-size: 10px; cursor: pointer;" aria-label="Xóa"></span>';
    
    container.appendChild(badge);
}

function xoaFileDinhKem(btnElement) {
    var badge = btnElement.closest('.file-badge');
    if (badge) {
        var fileName = badge.getAttribute('data-filename');
        window.dsFileDinhKem = window.dsFileDinhKem.filter(function(f) { return f.tentep !== fileName; });
        badge.remove();
    }
}
// ==================== KẾT THÚC XỬ LÝ FILE ====================

function xulyLuuTam(ath = false, xltc = null) {
    var isBGH = kiemTraLaBGH();
    let maTrangDich = (typeof canbHientai !== 'undefined' && canbHientai && canbHientai.canb) ? canbHientai.canb.ttrg : "";

    if (cotETonTai) { 
        var selectGv = document.getElementById("hopChonGv"); 
        if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { 
            if (!isBGH) { 
                if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Bạn không có quyền lưu nhật ký đánh giá của người khác."); 
                return; 
            } 
            maTrangDich = selectGv.value;
        } else if (isBGH) {
            if (!maTrangDich || maTrangDich.trim() === "") {
                if (typeof hienThongb === 'function') hienThongb('cbh', "⚠️ Đồng chí vui lòng chọn một giáo viên từ danh sách trước khi lưu.");
                return;
            }
        }
    }
    
    if (!window.PGV_IS_SELF && !isBGH) { 
        if (typeof hienThongb === 'function') hienThongb('loi', "Bạn không có quyền lưu nhật ký của người khác."); 
        return; 
    }

    if (!maTrangDich || maTrangDich.trim() === "") {
        let thongBaoLoi = isBGH ? "Đồng chí vui lòng chọn một giáo viên từ danh sách để lưu nhật ký." : "Lỗi hệ thống: Trang dữ liệu đích không xác định. Đồng chí kiểm tra lại Cột B tại Trang Khai Báo.";
        if (typeof hienThongb === 'function') hienThongb('loi', thongBaoLoi);
        return;
    }

    const ntl = document.getElementById("nutLuuTam"); if(ntl && !ath) ntl.disabled = true; if(!ath) hienTaiDl("✨ Đang ghi nhớ kết quả...");
    
    let dlbg = [];
    $('#bangNviec tbody tr.dongNv').each(function() {
        let ntt = $(this).find('.oStt').text() || "";
        let ndc = $(this).find('.nhapNdung').val() || "";
        let dMax = $(this).find('.nhapDiemMax').val() || "";
        let tGiao = $(this).find('.nhapTgGiao').val() || "";
        let lTdo = $(this).find('.nhapTdo').val() || "";
        let tHt = $(this).find('.nhapTgHt').val() || "";
        let nTH = $(this).find('.anNguoiTH').val() || "";
        let gc = $(this).find('.anGhiChu').val() || "";
        
        let inpH = $(this).find('.chonKq');
        let valChon = inpH.val() || "";
        let cfgGoc = inpH.attr('data-config') || "";
        let diemLuu = cfgGoc.includes("|") ? (valChon + "@@@" + cfgGoc) : valChon;
        
        dlbg.push([ntt, ndc, dMax, tGiao, lTdo, tHt, nTH, diemLuu, gc]);
    });

    let qth = $('#chuKqHthi'); let chukq = qth.is('input, select, textarea') ? qth.val() : qth.text(); chukq = chukq ? chukq.trim() : "";
    
    // Báo cáo chỉ lưu danh sách tên file, không lưu base64
    let noiDungBaoCao = $('#nhapBcao').val() || "";
    let chuoiFileDinhKem = window.dsFileDinhKem.map(function(f) { return f.tentep; }).join(', ');
    if (chuoiFileDinhKem && noiDungBaoCao) {
        noiDungBaoCao = noiDungBaoCao + '\n[File đính kèm: ' + chuoiFileDinhKem + ']';
    } else if (chuoiFileDinhKem) {
        noiDungBaoCao = '[File đính kèm: ' + chuoiFileDinhKem + ']';
    }
    
    const ht = { 
        ttrg: maTrangDich, 
        snnghi: $('#nhapSngayNghi').val() || 0, 
        dthuong: $('#nhapDiemThuong').val() || 0, 
        ldo: $('#nhapLdoNghi').val() || "", 
        kienn: $('#nhapYkien').val() || "", 
        bcao: noiDungBaoCao,
        dlbang: dlbg, 
        kq: chukq 
    };

    khachApi.luuTam(ht, function(kq) {
        if(!ath) anTaiDl(); if(ntl && !ath) ntl.disabled = false; if(typeof mokBcao === 'function') mokBcao();
        if (kq && kq.ttai === 'tcong') { 
            if (!ath) { 
                if (typeof hienThongb === 'function') hienThongb('tcong', "Đã ghi nhớ kết quả thành công!"); 
            } 
            if(xltc) xltc(); 
        } 
        else { 
            let ltc = kq ? kq.tbao : "Lỗi"; 
            if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi lưu: " + ltc); 
        }
    }, function(loi) { 
        if(!ath) anTaiDl(); 
        if(ntl && !ath) ntl.disabled = false; 
        if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi Server: " + (loi.message || loi)); 
    });
}

function nopBcaoChinh() {
    var isBGH = kiemTraLaBGH();
    let maTrangDich = (typeof canbHientai !== 'undefined' && canbHientai && canbHientai.canb) ? canbHientai.canb.ttrg : "";

    if (cotETonTai) { 
        var selectGv = document.getElementById("hopChonGv"); 
        if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { 
            if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Bạn không có quyền nộp báo cáo thay cho giáo viên khác."); 
            return; 
        } 
    }
    if (!window.PGV_IS_SELF && !isBGH) { 
        if (typeof hienThongb === 'function') hienThongb('loi', "Bạn không có quyền nộp báo cáo của người khác."); 
        return; 
    }
    if (!maTrangDich || maTrangDich.trim() === "") {
        if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi: Không xác định được mã hồ sơ để nộp báo cáo. Hãy kiểm tra lại khai báo.");
        return;
    }

    const gn = parseInt($('#nhapSngayNghi').val()) || 0, ld = $('#nhapLdoNghi').val().trim();
    if (gn > 0 && ld === "") {

function kiemTraTatCaRangBuoc(giaTriThuc, chuoiDieuKien) {
    if (!chuoiDieuKien || chuoiDieuKien.trim() === "") return false;
    var str = chuoiDieuKien.trim();
    var constraints = [];
    if (str.includes(',')) constraints = str.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
    else if (str.includes(' ')) constraints = str.split(/\s+/).filter(function(s){ return s; });
    else constraints = [str];
    if (constraints.length === 0) return false;
    var numVal = parseFloat(String(giaTriThuc).replace(/[^\d.-]/g, ''));
    if (isNaN(numVal)) return false;
    for (var c = 0; c < constraints.length; c++) {
        var cond = constraints[c];
        if (cond.startsWith(">=")) {
            var threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal >= threshold)) return false;
        } else if (cond.startsWith("<=")) {
            var threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal <= threshold)) return false;
        } else if (cond.startsWith(">") && !cond.startsWith(">=")) {
            var threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal > threshold)) return false;
        } else if (cond.startsWith("<") && !cond.startsWith("<=")) {
            var threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal < threshold)) return false;
        } else {
            var exact = parseFloat(cond.replace(/[^\d.-]/g, ''));
            if (isNaN(exact)) return false;
            if (Math.abs(numVal - exact) > 1e-9) return false;
        }
    }
    return true;
}

function tinhtTdong() {
    const dtc = document.getElementById('nhapDiemThuong'); 
    let dc = dtc ? (parseFloat(dtc.value) || 0) : 0;
    if(dtc) { 
        dtc.classList.remove('diemCong', 'diemTru', 'diemKhong'); 
        if (dc > 0) dtc.classList.add('diemCong'); 
        else if (dc < 0) dtc.classList.add('diemTru'); 
        else dtc.classList.add('diemKhong'); 
    }
    
    let tongDiem = 0;
    let tongMax = 0;
    let soNhiemVu = 0;
    let soDaDanhGia = 0;
    let minRank = 5;
    let hasJMLogic = false;

    document.querySelectorAll('#bangNviec tbody tr.dongNv').forEach(function(dg) {
        const cg = dg.querySelector('.chonKq');
        if (cg && cg.style.display !== 'none') {
            soNhiemVu++;
            const maxInp = dg.querySelector('.nhapDiemMax');
            if(maxInp && maxInp.value) {
                let mVal = parseFloat(maxInp.value);
                if(!isNaN(mVal)) tongMax += mVal;
            }
            if (cg.value !== "") {
                soDaDanhGia++;
                let valThuc = cg.value.trim();
                var txtHienThi = valThuc;
                if (cg.tagName === "SELECT") {
                    let selOpt = cg.options[cg.selectedIndex];
                    if (selOpt) txtHienThi = selOpt.text;
                }
                let diem = parseFloat(valThuc);
                if (!isNaN(diem)) tongDiem += diem;
                
                let j = (dg.querySelector('.oColJ') && dg.querySelector('.oColJ').value) ? dg.querySelector('.oColJ').value.trim() : "";
                let k = (dg.querySelector('.oColK') && dg.querySelector('.oColK').value) ? dg.querySelector('.oColK').value.trim() : "";
                let l = (dg.querySelector('.oColL') && dg.querySelector('.oColL').value) ? dg.querySelector('.oColL').value.trim() : "";
                let m = (dg.querySelector('.oColM') && dg.querySelector('.oColM').value) ? dg.querySelector('.oColM').value.trim() : "";
                
                if (j !== "" || k !== "" || l !== "" || m !== "") {
                    hasJMLogic = true;
                    var rank = 0;
                    if (kiemTraTatCaRangBuoc(valThuc, j)) rank = 4;
                    else if (kiemTraTatCaRangBuoc(valThuc, k)) rank = 3;
                    else if (kiemTraTatCaRangBuoc(valThuc, l)) rank = 2;
                    else if (kiemTraTatCaRangBuoc(valThuc, m)) rank = 1;
                    if (rank > 0) minRank = Math.min(minRank, rank);
                    else minRank = Math.min(minRank, 1);
                }
            }
        }
    });
    
    let diemCuoiCung = tongDiem + dc;
    let xpl = "Chưa hoàn thành";
    
    if (soNhiemVu === 0) {
        xpl = "Chưa giao việc";
    } else if (soDaDanhGia < soNhiemVu) {
        xpl = "Chưa đánh giá";
    } else {
        if (hasJMLogic) {
            if (minRank === 4) xpl = "Xuất sắc";
            else if (minRank === 3) xpl = "Hoàn thành tốt";
            else if (minRank === 2) xpl = "Hoàn thành";
            else if (minRank === 1) xpl = "Chưa hoàn thành";
            else xpl = "Chưa xác định";
        } else {
            let tyLe = tongMax > 0 ? (diemCuoiCung / tongMax) * 100 : diemCuoiCung;
            if (tyLe >= 90) xpl = "Xuất sắc";
            else if (tyLe >= 70) xpl = "Hoàn thành tốt";
            else if (tyLe >= 50) xpl = "Hoàn thành";
            else xpl = "Chưa hoàn thành";
        }
    }
    
    var txtKq = xpl;
    if (soNhiemVu > 0 && soDaDanhGia === soNhiemVu && xpl !== "Chưa giao việc" && xpl !== "Chưa đánh giá") {
        txtKq = xpl + ": " + diemCuoiCung + " điểm";
    }
    
    const qht = document.getElementById('chuKqHthi');
    if (qht) { 
        qht.innerText = txtKq; 
        qht.className = "fw-bold epMotDong"; 
        if (xpl === "Xuất sắc") qht.classList.add("text-success"); 
        else if (xpl.indexOf("Hoàn thành") >= 0) qht.classList.add("text-primary"); 
        else qht.classList.add("text-danger"); 
    }
    
    const theMenuDoc = document.querySelectorAll('#oKetQuaMenuDoc, .oKetQuaMenuDoc, .ketQuaMenuDoc');
    theMenuDoc.forEach(function(el) {
        el.innerText = txtKq;
        el.className = "epMotDong"; 
        if (xpl === "Xuất sắc") el.classList.add("text-success", "fw-bold"); 
        else if (xpl.indexOf("Hoàn thành") >= 0) el.classList.add("text-primary", "fw-bold"); 
        else el.classList.add("text-danger", "fw-bold"); 
    });
}
