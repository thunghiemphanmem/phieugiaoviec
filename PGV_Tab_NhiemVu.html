<style>
  .hopDau { background-color: #e9ecef; padding: 5px 10px; border-radius: 5px; margin-bottom: 5px; border: 1px solid #ced4da; }
  .loGo { font-weight: bold; color: #0d6efd; text-transform: uppercase; font-size: 14px; }
  .tDe { font-weight: bold; color: #dc3545; font-size: 20px; text-transform: uppercase; margin: 0; }
  .nhanNhiemVu { font-weight: bold; color: #333; font-size: 14px; }
  .chuThongTin { font-weight: bold; color: #0d6efd; font-size: 15px; margin-left: 5px; }
  .nhapTuyChinh { border: 1px solid #ced4da; border-radius: 4px; padding: 2px; outline: none; height: 30px; font-size: 14px; }
  .epMotDong { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }

  #bangNviec { table-layout: fixed; width: 100%; word-wrap: break-word; border-collapse: collapse; border: none; }
  #bangNviec thead th { position: sticky; top: 0; z-index: 10; background-color: #0d6efd !important; color: white !important; vertical-align: middle; text-align: center; padding: 8px 5px; font-size: 13px; border: none; border-right: 1px solid #7ea8f8;}
  #bangNviec th:last-child { border-right: none; }
  #bangNviec td { vertical-align: middle !important; padding: 0 !important; border: none !important; border-bottom: 1px dashed #dee2e6 !important; border-right: 1px solid #dee2e6 !important; overflow: hidden; }
  #bangNviec td:last-child { border-right: none !important; }

  #bangNviec textarea.form-control, #bangNviec input.form-control, #bangNviec select.form-select { 
      border: none !important; 
      background-color: transparent !important; 
      box-shadow: none !important; 
      border-radius: 0 !important;
      padding: 4px 6px !important; 
      margin: 0 !important;
      font-size: 14px;
      resize: none; 
      overflow: hidden;
  }
  #bangNviec textarea.form-control { min-height: 35px; line-height: 1.4; white-space: pre-wrap; cursor: default; }
  #bangNviec .nhapNgay, #bangNviec .chonKq { text-align: center; height: 30px; font-weight: bold; }
  
  #bangNviec input::placeholder { color: #adb5bd; font-style: italic; }

  .diemCong, .diemCong:disabled { background-color: #0d6efd !important; color: white !important; font-weight: bold; opacity: 1 !important; -webkit-text-fill-color: white !important; }
  .diemTru, .diemTru:disabled { background-color: #dc3545 !important; color: white !important; font-weight: bold; opacity: 1 !important; -webkit-text-fill-color: white !important; }
  .diemKhong, .diemKhong:disabled { background-color: #28a745 !important; color: black !important; font-weight: bold; opacity: 1 !important; -webkit-text-fill-color: black !important; }
  button:disabled { cursor: not-allowed !important; opacity: 0.5 !important; filter: grayscale(100%) !important; pointer-events: none !important; box-shadow: none !important; }
</style>

<div class="hopDau">
  <div class="d-flex align-items-center mb-1 w-100 position-relative">
    <div class="text-nowrap" style="flex: 1.5;">
      <span class="nhanNhiemVu">Thời gian:</span><span id="chuThoiGian" class="chuThongTin me-3">...</span>
      <span class="nhanNhiemVu border-start ps-3">Năm học:</span><span id="chuNamHoc" class="chuThongTin">...</span>
    </div>
    <div class="tDe text-center text-nowrap" style="flex: 2;">NHIỆM VỤ CỦA TÔI</div>
    <div class="text-end text-nowrap" style="flex: 1.5;"> 
      <div class="d-inline-block">
         <label class="me-1 fw-bold nhanNhiemVu" style="font-size:13px;">Điểm cộng/trừ:</label>
         <input type="number" id="nhapDiemThuong" oninput="capnhTdong()" class="nhapTuyChinh text-center fw-bold diemKhong" style="width: 50px; display:inline-block;" value="0">
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center mb-2 px-2 py-1 gap-2 flex-wrap" style="background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; min-height: 42px;">
     <div class="d-flex align-items-center justify-content-start px-3" style="flex: 1;">
         <span class="nhanNhiemVu me-2 text-nowrap">Số ngày nghỉ:</span><input type="number" id="nhapSngayNghi" class="nhapTuyChinh text-center me-2" style="width: 45px; font-weight: bold;" placeholder="0">
         <textarea id="nhapLdoNghi" class="form-control me-3" placeholder="Nhập lý do..." style="height: 30px; min-height: 30px; font-size: 13px; border-radius: 4px; width: 300px; resize: none; overflow: hidden; white-space: pre-wrap; padding: 4px 8px;" oninput="gdang(this)" onfocus="gdang(this)" onblur="cgon(this, '30px')"></textarea>
     </div>
     <div class="d-flex align-items-center justify-content-end gap-2" style="flex: auto;">
        <select id="hopChonGv" class="form-select form-select-sm border-primary fw-bold text-primary shadow-sm text-nowrap w-auto" style="display: none; height: 30px; font-size: 12px;" onchange="kiemTraQuyenTruyCap()"><option value="">-- Lựa chọn giáo viên --</option></select>
        <button class="btn btn-success btn-sm fw-bold d-flex align-items-center px-3 text-nowrap w-auto" onclick="xulyLuuTam()" style="height: 30px; justify-content: center;"><i class="bi bi-save me-1"></i> Lưu nhật ký</button>
        <button id="nutNopBcao" class="btn btn-primary btn-sm fw-bold d-flex align-items-center px-3 text-nowrap w-auto" onclick="nopBcaoChinh()" disabled style="height: 30px; justify-content: center;"><i class="bi bi-send me-1"></i> Nộp báo cáo</button>
     </div>
  </div>
    
  <div class="row g-1 mb-1">
    <div class="col-md-6"><textarea id="nhapYkien" class="form-control border-danger" placeholder="* Ý kiến tham mưu, đề xuất..." style="height: 45px; min-height: 45px; overflow-y: hidden; resize: none; font-size: 13px; border: 1px dashed #dc3545; padding: 3px; border-radius: 4px;" oninput="gdang(this)" onfocus="gdang(this)" onblur="cgon(this, '45px')"></textarea></div>
    <div class="col-md-6">
      <div style="position: relative;">
        <textarea id="nhapBcao" class="form-control border-danger" placeholder="* Báo cáo tóm tắt quá trình thực hiện..." style="height: 45px; min-height: 45px; overflow-y: hidden; resize: none; font-size: 13px; border: 1px dashed #dc3545; padding: 3px 30px 3px 3px; border-radius: 4px;" oninput="gdang(this)" onfocus="gdang(this)" onblur="cgon(this, '45px')"></textarea>
        <button class="btn btn-sm text-primary" onclick="document.getElementById('tepBcao').click()" style="position: absolute; top: 2px; right: 4px; padding: 0; background: transparent; border: none; z-index: 10;" title="Đính kèm báo cáo"><i class="bi bi-paperclip" style="font-size: 18px;"></i></button>
        <input type="file" id="tepBcao" multiple style="display:none;" onchange="xulyTaiBcao(this)">
      </div>
      <div id="vungDinhkBcao" class="mt-1 d-flex gap-1 flex-wrap justify-content-end"></div>
    </div>
  </div>
</div>

<div class="card shadow-sm p-0 border-0">
  <div class="table-responsive" style="max-height: 65vh; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 5px;">
    <table class="table table-hover mb-0" id="bangNviec">
      <thead><tr><th style="width: 3%;">TT</th><th style="width: 32%;">Nội dung công việc</th><th style="width: 8%;">Điểm Max</th><th style="width: 12%;">TG Giao</th><th style="width: 10%;">Tiến độ</th><th style="width: 12%;">TG Hoàn thành</th><th style="width: 20%;">Điểm đánh giá</th><th style="width: 3%;">Xoá</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="p-2 text-start bg-light border-top"><button class="btn btn-sm btn-outline-primary fw-bold" onclick="addNv()"><i class="bi bi-plus-circle"></i> Thêm nhiệm vụ</button></div>
</div>

<script>
let mbcMo = false; let cotETonTai = false; let giaTriCotE = ""; let dsGiaoVien = [];

function kiemTraLaBGH() {
    if (typeof window.PGV_QUYEN !== 'undefined' && (window.PGV_QUYEN === 'xxx' || window.PGV_QUYEN === 'xx')) return true;
    if (typeof canbHientai !== 'undefined' && (canbHientai.quyen === 'xxx' || canbHientai.quyen === 'xx')) return true;
    return false;
}

function kiemTraQuyenTruyCap() {
    var selectGv = document.getElementById("hopChonGv"); 
    var nutLuu = document.querySelector('button[onclick="xulyLuuTam()"]'); 
    var nutNop = document.getElementById("nutNopBcao");
    var diemThuong = document.getElementById("nhapDiemThuong");
    var isBGH = kiemTraLaBGH();

    if (cotETonTai && selectGv && selectGv.style.display !== "none") {
        var daChon = selectGv.value && selectGv.value !== "";
        if (daChon) { 
            if (isBGH) {
                if (nutLuu) nutLuu.disabled = false; 
                if (diemThuong) diemThuong.disabled = false;
                if (nutNop) nutNop.disabled = true; 
            } else {
                if (nutLuu) nutLuu.disabled = true; 
                if (nutNop) nutNop.disabled = true; 
                if (diemThuong) diemThuong.disabled = true;
                if (typeof hienThongb === 'function') hienThongb('chuy', '⚠️ Bạn đang xem nhật ký của giáo viên khác. Chỉ giáo viên đó hoặc Ban Giám hiệu mới được lưu.'); 
            }
        } else { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        }
    } else { 
        if (window.PGV_IS_SELF || isBGH) { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        } 
    }
}

function khoiTaoDropdownGiaoVien(danhSachGiaoVien) {
    var selectGv = document.getElementById("hopChonGv"); if (!selectGv) return;
    selectGv.innerHTML = '<option value="">-- Lựa chọn giáo viên --</option>';
    if (danhSachGiaoVien && danhSachGiaoVien.length > 0) { danhSachGiaoVien.forEach(function(gv) { var option = document.createElement("option"); option.value = gv.id || gv.ma || gv.ttrg; option.textContent = gv.ten || gv.hoTen || gv.tenn; selectGv.appendChild(option); }); selectGv.style.display = "inline-block"; selectGv.disabled = false; } 
    else { selectGv.style.display = "none"; selectGv.disabled = true; }
}

function xuLyCotE(giaTriE, danhSachGiaoVien) { 
    cotETonTai = true; giaTriCotE = giaTriE; dsGiaoVien = danhSachGiaoVien || []; 
    khoiTaoDropdownGiaoVien(dsGiaoVien); 
    kiemTraQuyenTruyCap(); 
}

function cdang(ptu) { 
    if(!ptu) return;
    ptu.style.height = 'auto'; 
    ptu.style.height = (ptu.scrollHeight) + 'px'; 
}
function gdang(ptu) { ptu.style.height = 'auto'; ptu.style.height = ptu.scrollHeight + 'px'; }
function cgon(ptu, ccao) { ptu.style.height = ccao; ptu.scrollTop = 0; }
function maHoaBcao(chu, tepdk) { let q = (chu || "").trim(); if (tepdk && tepdk.length > 0) { tepdk.forEach(t => { q += ` [FILE:${t.tentep}|${t.duongd}]`; }); } return q; }

function xulyLuuTam(ath = false, xltc = null) {
    var isBGH = kiemTraLaBGH();
    if (cotETonTai) { 
        var selectGv = document.getElementById("hopChonGv"); 
        if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { 
            if (!isBGH) { 
                if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Bạn không có quyền lưu nhật ký đánh giá của người khác."); 
                return; 
            } 
        } 
    }
    if (!window.PGV_IS_SELF && !isBGH) { 
        if (typeof hienThongb === 'function') hienThongb('loi', "Bạn không có quyền lưu nhật ký của người khác."); 
        return; 
    }

    const ntl = document.querySelector('button[onclick="xulyLuuTam()"]'); if(ntl && !ath) ntl.disabled = true; if(!ath) hienTaiDl("✨ Đang ghi nhớ kết quả...");
    
    let dlbg = [];
    $('#bangNviec tbody tr.dongNv').each(function() {
        let ntt = $(this).find('.oStt').text() || "";
        let ndc = $(this).find('.nhapNdung').val() || "";
        let dMax = $(this).find('.nhapDiemMax').val() || "";
        let tGiao = $(this).find('.nhapTgGiao').val() || "";
        let lTdo = $(this).find('.nhapTdo').val() || "";
        let tHt = $(this).find('.nhapTgHt').val() || "";
        
        let inpH = $(this).find('.chonKq');
        let valChon = inpH.val() || "";
        
        // Lưu đúng cấu trúc: [STT, ND, Điểm Max, TG Giao, Tiến độ, TGHT] - các trường gchu/nguoith tự xử lý trên máy chủ
        dlbg.push([ntt, ndc, tGiao, lTdo, valChon, tHt]);
    });

    let qth = $('#chuKqHthi'); let chukq = qth.is('input, select, textarea') ? qth.val() : qth.text(); chukq = chukq ? chukq.trim() : "";
    const ht = { ttrg: canbHientai.canb.ttrg, snnghi: $('#nhapSngayNghi').val() || 0, dthuong: $('#nhapDiemThuong').val() || 0, ldo: $('#nhapLdoNghi').val() || "", kienn: $('#nhapYkien').val() || "", bcao: maHoaBcao($('#nhapBcao').val() || "", window.tepdinhkBcao), dlbang: dlbg, kq: chukq };

    khachApi.luuTam(ht, function(kq) {
        if(!ath) anTaiDl(); if(ntl && !ath) ntl.disabled = false; if(typeof mokBcao === 'function') mokBcao();
        if (kq && kq.ttai === 'tcong') { if (!ath) { if (typeof hienThongb === 'function') hienThongb('tcong', "Đã ghi nhớ kết quả thành công!"); } if(xltc) xltc(); } 
        else { let ltc = kq ? kq.tbao : "Lỗi"; if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi lưu: " + ltc); }
    }, function(loi) { if(!ath) anTaiDl(); if(ntl && !ath) ntl.disabled = false; if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi Server: " + loi.message); });
}

function nopBcaoChinh() {
    var isBGH = kiemTraLaBGH();
    if (cotETonTai) { 
        var selectGv = document.getElementById("hopChonGv"); 
        if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { 
            if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Bạn không có quyền nộp báo cáo thay cho giáo viên khác."); 
            return; 
        } 
    }
    if (!window.PGV_IS_SELF && !isBGH) { 
        if (typeof hienThongb === 'function') hienThongb('loi', "Bạn không có quyền nộp báo cáo của người khác."); 
        return; 
    }
    const gn = parseInt($('#nhapSngayNghi').val()) || 0, ld = $('#nhapLdoNghi').val().trim();
    if (gn > 0 && ld === "") { hienThongb('cbh', `Bạn đã có ${gn} ngày nghỉ.\nPhải nhập lý do!`, () => setTimeout(() => $('#nhapLdoNghi').focus(), 500)); return; }
    hienThongb('xn', "Hệ thống sẽ đồng bộ nhật ký và nộp báo cáo. Xác nhận?", function() {
      const ntn = document.getElementById('nutNopBcao'); if(ntn) ntn.disabled = true; hienTaiDl("🚀 Bước 1: Đang lưu vào nhật ký cá nhân...");
      xulyLuuTam(true, function() {
          hienTaiDl("🚀 Bước 2: Đang ghi vào dữ liệu tổng...");
          let ht = $('#chuKqHthi'); let chukq = ht.is('input, select, textarea') ? ht.val() : ht.text(); chukq = chukq ? chukq.trim() : "";
          const cnb = { ttrg: canbHientai.canb.ttrg, tenn: canbHientai.tde.tenn, snnghi: $('#nhapSngayNghi').val(), nhoc: canbHientai.tde.nhoc, tgian: canbHientai.tde.tgian, kq: chukq, dthuong: $('#nhapDiemThuong').val(), kienn: $('#nhapYkien').val(), bcao: maHoaBcao($('#nhapBcao').val() || "", window.tepdinhkBcao), ldo: $('#nhapLdoNghi').val(), taik: window.PGV_ID_TC };
          khachApi.nopBcao(cnb, function(kq) {
            anTaiDl(); if(ntn) ntn.disabled = false; 
            if (kq && kq.ttai === 'tcong') { $('#chuTrangThai').text("Đã nộp báo cáo"); let tc = (kq.lacn === true) ? "Đã nộp lại kết quả mới nhất" : "Đã nộp xong kết quả"; hienThongb('tcong', tc); if(typeof taiDlBdau === 'function') taiDlBdau(); if(typeof khaBcao === 'function') khaBcao(); } 
            else { hienThongb('loi', "Lỗi nộp báo cáo: " + (kq ? kq.tbao : "Lỗi")); }
          }, function(loi) { if(ntn) ntn.disabled = false; if(typeof khiLoiMayChu === 'function') khiLoiMayChu(loi); });
      });
    });
}

function mokBcao() { mbcMo = true; const nt = document.getElementById('nutNopBcao'); if(nt && nt.style.display !== 'none') { nt.disabled = false; } }
function khaBcao() { if (!mbcMo) { const nt = document.getElementById('nutNopBcao'); if(nt && nt.style.display !== 'none') nt.disabled = true; } }

function ktraAnHienTieuDe(ptu) {
    let isTitle = ptu.value.trim().startsWith('*');
    let tr = ptu.closest('tr');
    let tdNoiDung = ptu.closest('td');
    
    if(isTitle) {
        ptu.classList.add('fw-bold', 'text-primary', 'text-uppercase');
        tdNoiDung.colSpan = 7;
        tr.querySelectorAll('td:nth-child(n+3)').forEach(td => td.style.display = 'none');
    } else {
        ptu.classList.remove('fw-bold', 'text-primary', 'text-uppercase');
        tdNoiDung.colSpan = 1;
        tr.querySelectorAll('td:nth-child(n+3)').forEach(td => td.style.display = '');
    }
    tinhtTdong();
}

function veBangNviec(db) {
    khaBcao(); const bg = $('#bangNviec tbody').empty();
    if (!db || db.length === 0) { bg.append('<tr><td colspan="8" class="text-center text-muted py-3 small">Chưa có nhiệm vụ.</td></tr>'); tinhtTdong(); return; }
    
    const showDeleteBtn = window.PGV_CAN_SHOW_DELETE_BUTTON === true;
    db.forEach((dong, chs) => {
        let sn = dong[0] || "";
        let ndc = dong[1] || ""; let dMax = dong[2] || ""; let tGiao = dong[3] || ""; let lTdo = dong[4] || ""; let tHt = dong[5] || "";
        let nTH = dong[6] || ""; let valChon = dong[7] || ""; let gc = dong[8] || "";
        
        let valConfig = dong[9] || "";
        let jVal = dong[10] || "";
        let kVal = dong[11] || "";
        let lVal = dong[12] || "";
        let mVal = dong[13] || "";
        
        let isTitle = ndc.trim().startsWith('*');
        let dsp = isTitle ? 'display: none;' : '';
        let fw = isTitle ? 'fw-bold text-primary text-uppercase' : '';
        let colSp = isTitle ? 'colspan="7"' : '';

        let vTgGiao = tGiao.toLowerCase() === "dd/mm/yyyy" ? "" : tGiao;
        let vTgHt = tHt.toLowerCase() === "dd/mm/yyyy" ? "" : tHt;

        // VẼ Ô NHẬP ĐIỂM DỰA VÀO CẤU HÌNH (valConfig)
        let htmlDiem = `<input type="text" class="form-control form-control-sm text-center fw-bold chonKq" value="${valChon}" style="color:red; ${dsp}" oninput="tinhtTdong()" onchange="tinhtTdong()">`;
        if (valConfig.includes("|")) {
            htmlDiem = `<select class="form-select form-select-sm text-center fw-bold chonKq" style="color:red; ${dsp}" onchange="tinhtTdong()">`;
            htmlDiem += `<option value="">-- Trống --</option>`;
            let opts = valConfig.split(",");
            opts.forEach(opt => {
                let kv = opt.split("|"); let txt = kv[0].trim(); let val = kv.length > 1 ? kv[1].trim() : txt;
                let isSel = (val === valChon || txt === valChon) ? "selected" : "";
                htmlDiem += `<option value="${val}" ${isSel}>${txt}</option>`;
            });
            htmlDiem += `</select>`;
        }

        let nutx = showDeleteBtn ? `<button class="btn btn-sm btn-danger py-0 px-2" onclick="xoaDongNv(this)">✕</button>` : ``;
        let dg = `<tr class="dongNv">
          <td class="text-center align-middle oStt fw-bold">${sn}</td>
          <td ${colSp}>
              <textarea class="form-control nhapNdung ${fw}" readonly rows="1" oninput="cdang(this)" onfocus="cdang(this)">${ndc}</textarea>
              <input type="hidden" class="anNguoiTH" value="${nTH}">
              <input type="hidden" class="anGhiChu" value="${gc}">
              <input type="hidden" class="dkXuatSac" value="${jVal}">
              <input type="hidden" class="dkTot" value="${kVal}">
              <input type="hidden" class="dkHoanThanh" value="${lVal}">
              <input type="hidden" class="dkKhongHT" value="${mVal}">
          </td>
          <td class="align-middle" style="${dsp}"><input type="text" class="form-control form-control-sm text-center nhapDiemMax" value="${dMax}" readonly></td>
          <td class="align-middle" style="${dsp}"><input type="text" class="form-control form-control-sm text-center nhapTgGiao" placeholder="dd/mm/yyyy" value="${vTgGiao}" readonly></td>
          <td class="align-middle" style="${dsp}"><input type="text" class="form-control form-control-sm text-center nhapTdo" value="${lTdo}" readonly></td>
          <td class="align-middle" style="${dsp}"><input type="text" class="form-control form-control-sm text-center nhapTgHt" placeholder="dd/mm/yyyy" value="${vTgHt}"></td>
          <td class="align-middle" style="${dsp}">
             ${htmlDiem}
             <div class="mt-1 oXepLoaiDong text-center" style="font-size: 11px;"></div>
          </td>
          <td class="text-center align-middle" style="${dsp}">${nutx}</td>
        </tr>`; bg.append(dg);
    });
    setTimeout(() => { $('#bangNviec textarea').each(function() { cdang(this); }); tinhtTdong(); khaBcao(); }, 100);
}

function addNv() {
    var isBGH = kiemTraLaBGH();
    if (cotETonTai) { var selectGv = document.getElementById("hopChonGv"); if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { if (!isBGH) { if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Không thể sửa dòng của người khác."); return; } } }
    const bg = $('#bangNviec tbody'); if (bg.find('tr td').length === 1) { bg.empty(); } let sn = bg.find('tr.dongNv').length + 1;
    let dg = `<tr class="dongNv"><td class="text-center align-middle oStt">${sn}</td><td><textarea class="form-control nhapNdung" oninput="cdang(this); ktraAnHienTieuDe(this);" rows="1" placeholder="Nhập nội dung..."></textarea><input type="hidden" class="anNguoiTH" value=""><input type="hidden" class="anGhiChu" value=""><input type="hidden" class="dkXuatSac" value=""><input type="hidden" class="dkTot" value=""><input type="hidden" class="dkHoanThanh" value=""><input type="hidden" class="dkKhongHT" value=""></td><td class="align-middle"><input type="text" class="form-control form-control-sm text-center nhapDiemMax"></td><td class="align-middle"><input type="text" class="form-control form-control-sm text-center nhapTgGiao" placeholder="dd/mm/yyyy"></td><td class="align-middle"><input type="text" class="form-control form-control-sm text-center nhapTdo"></td><td class="align-middle"><input type="text" class="form-control form-control-sm text-center nhapTgHt" placeholder="dd/mm/yyyy"></td><td class="align-middle"><input type="text" class="form-control form-control-sm text-center chonKq" oninput="tinhtTdong()" onchange="tinhtTdong()"><div class="mt-1 oXepLoaiDong text-center" style="font-size: 11px;"></div></td><td class="text-center align-middle"><button class="btn btn-sm btn-danger py-0 px-2" onclick="xoaDongNv(this)">✕</button></td></tr>`; bg.append(dg); tinhtTdong(); if(typeof mokBcao === 'function') mokBcao();
}

function xoaDongNv(nt) { if(confirm("Xác nhận xóa?")) { $(nt).closest('tr').remove(); dlStt(); tinhtTdong(); } }
function dlStt() { $('#bangNviec tbody tr.dongNv').each(function(chs) { $(this).find('.oStt').text(chs + 1); }); }

/* HÀM ĐỐI CHIẾU TIÊU CHÍ VÀ TÍNH ĐIỂM THỜI GIAN THỰC ĐÃ NÂNG CẤP ĐỌC CÚ PHÁP HOẶC (||) */
function tinhtTdong() {
    const dtc = document.getElementById('nhapDiemThuong'); 
    let dc = dtc ? (parseFloat(dtc.value) || 0) : 0;
    if(dtc) { 
        dtc.classList.remove('diemCong', 'diemTru', 'diemKhong'); 
        if (dc > 0) dtc.classList.add('diemCong'); 
        else if (dc < 0) dtc.classList.add('diemTru'); 
        else dtc.classList.add('diemKhong'); 
    }
    
    let tongDiem = 0;
    let minRank = 4; 
    let hasEvaluation = false;
    
    const cdt = document.querySelectorAll('#bangNviec tbody tr.dongNv');
    
    cdt.forEach((dg) => {
        const cg = dg.querySelector('.chonKq');
        const xlDong = dg.querySelector('.oXepLoaiDong');
        if (xlDong) xlDong.innerHTML = ''; 

        if (cg && cg.style.display !== 'none' && cg.value !== "") {
            let diem = parseFloat(cg.value);
            if (!isNaN(diem)) tongDiem += diem;
            
            let selectedText = "";
            if (cg.tagName === "SELECT") {
                selectedText = cg.options[cg.selectedIndex].text.trim();
            } else {
                selectedText = cg.value.trim();
            }
            let valScore = cg.value.trim();
            
            let valJ = (dg.querySelector('.dkXuatSac')?.value || "").trim();
            let valK = (dg.querySelector('.dkTot')?.value || "").trim();
            let valL = (dg.querySelector('.dkHoanThanh')?.value || "").trim();
            let valM = (dg.querySelector('.dkKhongHT')?.value || "").trim();
            
            if (valJ !== "" || valK !== "" || valL !== "" || valM !== "") {
                hasEvaluation = true;
                let rowRank = 0; 
                
                const match = (condString, txt1, txt2) => {
                    if (!condString) return false;
                    let conditions = condString.split('||').map(s => s.trim().toLowerCase());
                    let t1 = txt1.toLowerCase();
                    let t2 = txt2.toLowerCase();
                    
                    return conditions.some(c => {
                        if (c === "") return false;
                        if (t1 === c || t2 === c) return true;
                        if (c.includes('%') && (t1.includes(c) || t2.includes(c))) return true;
                        if (!isNaN(c) && (t1 === c || t2 === c)) return true;
                        return false;
                    });
                };
                
                if (match(valJ, selectedText, valScore)) rowRank = 4;
                else if (match(valK, selectedText, valScore)) rowRank = 3;
                else if (match(valL, selectedText, valScore)) rowRank = 2;
                else if (match(valM, selectedText, valScore)) rowRank = 1;
                
                if (rowRank > 0) {
                    if (rowRank < minRank) minRank = rowRank;
                    
                    if (xlDong) {
                        if (rowRank === 4) xlDong.innerHTML = '<span class="badge bg-success">Xuất sắc</span>';
                        else if (rowRank === 3) xlDong.innerHTML = '<span class="badge bg-primary">Tốt</span>';
                        else if (rowRank === 2) xlDong.innerHTML = '<span class="badge bg-warning text-dark">Hoàn thành</span>';
                        else if (rowRank === 1) xlDong.innerHTML = '<span class="badge bg-danger">Không HT</span>';
                    }
                }
            }
        }
    });
    
    let diemCuoiCung = tongDiem + dc;
    let xepLoai = "";
    
    if (!hasEvaluation) {
        if (diemCuoiCung >= 90) xepLoai = "Xuất sắc";
        else if (diemCuoiCung >= 70) xepLoai = "Tốt";
        else if (diemCuoiCung >= 50) xepLoai = "Hoàn thành";
        else if (diemCuoiCung > 0) xepLoai = "Không hoàn thành";
        else xepLoai = "Chưa đánh giá";
    } else {
        if (minRank === 4) xepLoai = "Xuất sắc";
        else if (minRank === 3) xepLoai = "Tốt";
        else if (minRank === 2) xepLoai = "Hoàn thành";
        else xepLoai = "Không hoàn thành";
    }
    
    let txtKq = "";
    if (diemCuoiCung === 0 && tongDiem === 0 && !hasEvaluation) {
        txtKq = "Chưa có kết quả";
    } else {
        txtKq = `${xepLoai}: ${diemCuoiCung} điểm`;
    }
    
    const qht = document.getElementById('chuKqHthi');
    if (qht) { 
        qht.innerText = txtKq; 
        qht.className = "fw-bold text-danger epMotDong"; 
    }
    
    const theMenuDoc = document.querySelectorAll('#oKetQuaMenuDoc, .oKetQuaMenuDoc, .ketQuaMenuDoc');
    theMenuDoc.forEach(el => {
        el.innerText = txtKq;
    });
}

function capnhTdong() { tinhtTdong(); }

function khoiTaoTheoQuyen() {
    if (typeof canbHientai !== 'undefined' && canbHientai.quyen === 'xx') {
        if (typeof khachApi !== 'undefined' && typeof khachApi.gvLaydsCanb === 'function') { khachApi.gvLaydsCanb(function(dl) { xuLyCotE('xx', dl); }, function(err) { xuLyCotE('xx', []); }); } else { xuLyCotE('xx', []); }
    } else {
        cotETonTai = false; document.getElementById("hopChonGv").style.display = 'none';
        kiemTraQuyenTruyCap();
    }
}
$(document).ready(function() { setTimeout(khoiTaoTheoQuyen, 500); });
