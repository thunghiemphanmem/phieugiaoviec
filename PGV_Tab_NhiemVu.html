<script>
// ================= BIẾN TOÀN CỤC =================
let mbcMo = false; 
let cotETonTai = false; 
let giaTriCotE = ""; 
let dsGiaoVien = [];
window.tepdinhkBcao = window.tepdinhkBcao || [];

// ================= HÀM HIỂN THỊ LOADING =================
function hienTaiDl(message) {
    var overlay = document.getElementById('loadingOverlay');
    var msgSpan = document.getElementById('loadingMessage');
    if (overlay) {
        if (msgSpan) msgSpan.innerText = message || 'Đang xử lý...';
        overlay.style.display = 'flex';
    } else {
        console.log('Loading:', message);
    }
}

function anTaiDl() {
    var overlay = document.getElementById('loadingOverlay');
    if (overlay) {
        overlay.style.display = 'none';
    }
}

function hienThongb(type, message, callback) {
    if (type === 'tcong') {
        alert('✅ ' + message);
    } else if (type === 'loi') {
        alert('❌ ' + message);
    } else if (type === 'cbh') {
        alert('⚠️ ' + message);
    } else if (type === 'xn') {
        if (confirm(message)) {
            if (callback) callback();
        }
    } else if (type === 'chuy') {
        alert('ℹ️ ' + message);
    }
    if (callback && type !== 'xn') callback();
}

// ================= KIỂM TRA QUYỀN =================
function kiemTraLaBGH() {
    if (typeof window.PGV_QUYEN !== 'undefined' && (window.PGV_QUYEN === 'xxx' || window.PGV_QUYEN === 'xx')) return true;
    if (typeof canbHientai !== 'undefined' && canbHientai && (canbHientai.quyen === 'xxx' || canbHientai.quyen === 'xx')) return true;
    return false;
}

function kiemTraQuyenTruyCap() {
    var selectGv = document.getElementById("hopChonGv"); 
    var nutLuu = document.getElementById("nutLuuTam"); 
    var nutNop = document.getElementById("nutNopBcao");
    var diemThuong = document.getElementById("nhapDiemThuong");
    var isBGH = kiemTraLaBGH();

    if (cotETonTai && selectGv && selectGv.style.display !== "none") {
        var daChon = selectGv.value && selectGv.value !== "";
        if (daChon) { 
            if (isBGH) {
                if (nutLuu) nutLuu.disabled = false; 
                if (diemThuong) diemThuong.disabled = false;
                if (nutNop) nutNop.disabled = true; 
            } else {
                if (nutLuu) nutLuu.disabled = true; 
                if (nutNop) nutNop.disabled = true; 
                if (diemThuong) diemThuong.disabled = true;
                hienThongb('chuy', '⚠️ Bạn đang xem nhật ký của giáo viên khác. Chỉ giáo viên đó hoặc Ban Giám hiệu mới được lưu.'); 
            }
        } else { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        }
    } else { 
        if (window.PGV_IS_SELF || isBGH) { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        } 
    }
}

function khoiTaoDropdownGiaoVien(danhSachGiaoVien) {
    var selectGv = document.getElementById("hopChonGv"); if (!selectGv) return;
    selectGv.innerHTML = '<option value="">-- Lựa chọn giáo viên --</option>';
    if (danhSachGiaoVien && danhSachGiaoVien.length > 0) { 
        danhSachGiaoVien.forEach(function(gv) { 
            var option = document.createElement("option"); 
            option.value = gv.id || gv.ma || gv.ttrg; 
            option.textContent = gv.ten || gv.hoTen || gv.tenn; 
            selectGv.appendChild(option); 
        }); 
        selectGv.style.display = "inline-block"; 
        selectGv.disabled = false; 
    } 
    else { 
        selectGv.style.display = "none"; 
        selectGv.disabled = true; 
    }
}

function xuLyCotE(giaTriE, danhSachGiaoVien) { 
    cotETonTai = true; 
    giaTriCotE = giaTriE; 
    dsGiaoVien = danhSachGiaoVien || []; 
    khoiTaoDropdownGiaoVien(dsGiaoVien); 
    kiemTraQuyenTruyCap(); 
}

// ================= HÀM XỬ LÝ FILE ĐÍNH KÈM (ĐÃ SỬA LỖI) =================
function xulyTaiBcao(ptu) {
    if (!ptu.files || ptu.files.length === 0) return;
    
    hienTaiDl("⏳ Đang tải lên " + ptu.files.length + " file đính kèm...");
    
    let files = Array.from(ptu.files);
    let uploadedFiles = [];
    let completedCount = 0;
    
    // Hàm kiểm tra hoàn thành tất cả file
    function checkAllCompleted() {
        if (completedCount === files.length) {
            anTaiDl();
            ptu.value = "";
            
            if (uploadedFiles.length > 0) {
                if (!window.tepdinhkBcao) window.tepdinhkBcao = [];
                window.tepdinhkBcao = window.tepdinhkBcao.concat(uploadedFiles);
                veDinhKemBcao();
                
                // Tự động lưu sau khi đính kèm
                xulyLuuTam(true, function() {
                    hienThongb('tcong', 'Đã đính kèm thành công ' + uploadedFiles.length + ' file!');
                });
            } else {
                hienThongb('loi', 'Không có file nào được tải lên thành công');
            }
        }
    }
    
    // Xử lý từng file
    files.forEach(function(file) {
        var reader = new FileReader();
        
        reader.onload = function(e) {
            var base64Data = e.target.result.split(',')[1];
            var fileData = {
                tentep: file.name,
                kieu: file.type,
                dliu: base64Data
            };
            
            // Kiểm tra API có tồn tại không
            if (typeof khachApi !== 'undefined' && khachApi && typeof khachApi.taiTepBcao === 'function') {
                // Gọi API để upload lên server
                khachApi.taiTepBcao({ teps: [fileData] }, function(kq) {
                    if (kq && (kq.ttai === 'tcong' || kq.ttai === true)) {
                        // Xử lý kết quả trả về
                        if (kq.dliu && Array.isArray(kq.dliu)) {
                            uploadedFiles.push(...kq.dliu);
                        } else if (kq.data && Array.isArray(kq.data)) {
                            uploadedFiles.push(...kq.data);
                        } else {
                            uploadedFiles.push({
                                tentep: file.name,
                                duongd: kq.duongd || kq.url || '/uploads/' + file.name,
                                kieu: file.type,
                                ngaytao: new Date().toISOString()
                            });
                        }
                    } else {
                        var errMsg = (kq && kq.tbao) ? kq.tbao : 'Lỗi không xác định từ server';
                        hienThongb('loi', 'Lỗi tải file "' + file.name + '": ' + errMsg);
                    }
                    completedCount++;
                    checkAllCompleted();
                }, function(error) {
                    console.error('API Error:', error);
                    hienThongb('loi', 'Lỗi kết nối server khi tải file "' + file.name + '": ' + (error.message || 'Không xác định'));
                    completedCount++;
                    checkAllCompleted();
                });
            } else {
                // Fallback: Lưu tạm ở client nếu không có API
                console.warn('khachApi.taiTepBcao không khả dụng, lưu file tạm ở client');
                uploadedFiles.push({
                    tentep: file.name,
                    duongd: 'data:' + file.type + ';base64,' + base64Data,
                    kieu: file.type,
                    tamthoi: true,
                    ngaytao: new Date().toISOString()
                });
                completedCount++;
                checkAllCompleted();
            }
        };
        
        reader.onerror = function() {
            hienThongb('loi', 'Lỗi đọc file: ' + file.name);
            completedCount++;
            checkAllCompleted();
        };
        
        reader.readAsDataURL(file);
    });
}

function veDinhKemBcao() {
    let kc = $('#vungDinhkBcao');
    kc.empty();
    
    if (!window.tepdinhkBcao || window.tepdinhkBcao.length === 0) return;
    
    window.tepdinhkBcao.forEach((tc, chs) => {
        let tenFile = tc.tentep || `Báo cáo ${chs + 1}`;
        let isTamThoi = tc.tamthoi === true;
        let bgColor = isTamThoi ? 'bg-warning' : 'bg-info';
        let titleMsg = isTamThoi ? '⚠️ File lưu tạm (chưa đồng bộ server)' : tenFile;
        
        let b = $(`
            <span class="badge ${bgColor} text-dark shadow-sm" 
                 style="font-size: 12px; cursor: pointer; border: 1px solid #90caf9; padding: 4px 6px; display: inline-flex; align-items: center; gap: 5px;" 
                 title="${titleMsg}">
                <i class="bi ${isTamThoi ? 'bi-clock-history' : 'bi-paperclip'}"></i> 
                <span style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(tenFile)}</span>
                <i class="bi bi-x text-danger fw-bold" style="font-size: 15px; cursor: pointer;" 
                   onclick="xoaDinhKemBcao(${chs}); event.stopPropagation();" 
                   title="Xóa đính kèm này"></i>
            </span>
        `);
        
        b.on('click', function(e) {
            if (!$(e.target).hasClass('bi-x')) {
                if (tc.duongd) {
                    if (tc.duongd.startsWith('data:')) {
                        var win = window.open();
                        win.document.write('<iframe src="' + tc.duongd + '" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>');
                    } else {
                        window.open(tc.duongd, '_blank');
                    }
                } else {
                    hienThongb('loi', 'Không tìm thấy đường dẫn file');
                }
            }
        });
        
        kc.append(b);
    });
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function xoaDinhKemBcao(chs) {
    const cbm = "Thầy/Cô có chắc chắn muốn xóa file đính kèm này không?";
    
    if (typeof hienThongb === 'function') {
        hienThongb('xn', cbm, function() {
            xulyXoaTepDc(chs);
        });
    } else {
        if (confirm(cbm)) xulyXoaTepDc(chs);
    }
}

function xulyXoaTepDc(chs) {
    let tpx = window.tepdinhkBcao[chs];
    
    if (!tpx) return;
    
    if (tpx.tamthoi === true || !tpx.duongd || tpx.duongd.startsWith('data:')) {
        window.tepdinhkBcao.splice(chs, 1);
        veDinhKemBcao();
        hienThongb('tcong', 'Đã xóa file đính kèm khỏi danh sách');
        return;
    }
    
    hienTaiDl("⏳ Đang xóa file khỏi hệ thống...");
    
    if (typeof khachApi !== 'undefined' && khachApi && typeof khachApi.xoaTepBcao === 'function') {
        khachApi.xoaTepBcao({ duongd: tpx.duongd }, function(kq) {
            if (kq && kq.ttai === 'tcong') {
                window.tepdinhkBcao.splice(chs, 1);
                veDinhKemBcao();
                xulyLuuTam(true, function() {
                    anTaiDl();
                    hienThongb('tcong', 'Đã xóa file đính kèm thành công!');
                });
            } else {
                anTaiDl();
                window.tepdinhkBcao.splice(chs, 1);
                veDinhKemBcao();
                hienThongb('loi', "Lỗi xóa file trên server, nhưng đã xóa khỏi danh sách: " + (kq.tbao || "Không xác định"));
            }
        }, function(loi) {
            anTaiDl();
            hienThongb('loi', "Lỗi kết nối Server: " + loi.message);
        });
    } else {
        anTaiDl();
        window.tepdinhkBcao.splice(chs, 1);
        veDinhKemBcao();
        hienThongb('tcong', 'Đã xóa file khỏi danh sách (chưa xóa trên server)');
    }
}

function resetFileDinhKem() {
    window.tepdinhkBcao = [];
    veDinhKemBcao();
}

// ================= HÀM TIỆN ÍCH =================
function cdang(ptu) { 
    if(!ptu) return;
    ptu.style.height = 'auto'; 
    ptu.style.height = (ptu.scrollHeight) + 'px';

function maHoaBcao(chu, tepdk) {
    let q = (chu || "").trim();
    if (tepdk && tepdk.length > 0) {
        tepdk.forEach(t => {
            if (t.duongd) {
                if (!t.tamthoi) {
                    q += ` [FILE:${t.tentep}|${t.duongd}]`;
                } else {
                    q += ` [FILE_TAM:${t.tentep}]`;
                }
            }
        });
    }
    return q;
}

        let safeConfig = valConfig.replace(/"/g, '&quot;');

        let isTitle = ndc.trim().startsWith('*');

            if (valConfig.includes(";")) {
                optsArray = valConfig.split(";");
            } else if (valConfig.includes("\n")) {
                let lines = valConfig.split("\n");

                optsArray = valConfig.split(",");

            optsArray.forEach(opt => {
                let kv = opt.split("|");

                let val = kv.length > 1 ? kv[1].replace(/[\r\n]+/g, '').trim() : txt;

        let nutx = showDeleteBtn ? `<button class="btn btn-sm btn-danger py-0 px-2" onclick="xoaDongNv(this)">✕</button>` : ``;

          <td class="align-middle" style="${dsp}"><input type="text" class="form-control form-control-sm text-center nhapTgGiao" placeholder="dd/mm/yyyy" value="${escapeHtml(vTgGiao)}" readonly></td>
          <td class="align-middle" style="${dsp}"><input type="text" class="form-control form-control-sm text-center nhapTdo" value="${escapeHtml(lTdo)}" readonly></td>
          <td class="align-middle" style="${dsp}"><input type="text" class="form-control form-control-sm text-center nhapTgHt" placeholder="dd/mm/yyyy" value="${escapeHtml(vTgHt)}"></td>
          <td class="align-middle" style="${dsp}">${htmlDiem}</td>
          <td class="text-center align-middle" style="${dsp}">${nutx}</td>
        <tr>`;
        bg.append(dg);
    });
    setTimeout(() => { $('#bangNviec textarea').each(function() { cdang(this); }); tinhtTdong(); khaBcao(); }, 100);

// ================= HÀM TÍNH ĐIỂM =================
function kiemTraTatCaRangBuoc(giaTriThuc, chuoiDieuKien) {
    if (!chuoiDieuKien || chuoiDieuKien.trim() === "") return false;
    let str = chuoiDieuKien.trim();
    let constraints = [];
    if (str.includes(',')) constraints = str.split(',').map(s=>s.trim()).filter(s=>s);
    else if (str.includes(' ')) constraints = str.split(/\s+/).filter(s=>s);
    else constraints = [str];
    if (constraints.length === 0) return false;
    let numVal = parseFloat(String(giaTriThuc).replace(/[^\d.-]/g, ''));
    if (isNaN(numVal)) return false;
    for (let cond of constraints) {
        if (cond.startsWith(">=")) {
            let threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal >= threshold)) return false;
        } else if (cond.startsWith("<=")) {
            let threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal <= threshold)) return false;
        } else if (cond.startsWith(">") && !cond.startsWith(">=")) {
            let threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal > threshold)) return false;
        } else if (cond.startsWith("<") && !cond.startsWith("<=")) {
            let threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal < threshold)) return false;
        } else {
            let exact = parseFloat(cond.replace(/[^\d.-]/g, ''));
            if (isNaN(exact)) return false;
            if (Math.abs(numVal - exact) > 1e-9) return false;
        }
    }
    return true;
}

function tinhtTdong() {
    const dtc = document.getElementById('nhapDiemThuong'); 
    let dc = dtc ? (parseFloat(dtc.value) || 0) : 0;
    if(dtc) { 
        dtc.classList.remove('diemCong', 'diemTru', 'diemKhong'); 
        if (dc > 0) dtc.classList.add('diemCong'); 
        else if (dc < 0) dtc.classList.add('diemTru'); 
        else dtc.classList.add('diemKhong'); 
    }
    
    let tongDiem = 0;
    let tongMax = 0;
    let soNhiemVu = 0;
    let soDaDanhGia = 0;
    let minRank = 5;
    let hasJMLogic = false;

    document.querySelectorAll('#bangNviec tbody tr.dongNv').forEach((dg) => {
        const cg = dg.querySelector('.chonKq');
        if (cg && cg.style.display !== 'none') {
            soNhiemVu++;
            const maxInp = dg.querySelector('.nhapDiemMax');
            if(maxInp && maxInp.value) {
                let mVal = parseFloat(maxInp.value);
                if(!isNaN(mVal)) tongMax += mVal;
            }
            if (cg.value !== "") {
                soDaDanhGia++;
                let valThuc = cg.value.trim();
                let txtHienThi = valThuc;
                if (cg.tagName === "SELECT") {
                    let selOpt = cg.options[cg.selectedIndex];
                    if (selOpt) txtHienThi = selOpt.text;
                }
                let diem = parseFloat(valThuc);
                if (!isNaN(diem)) tongDiem += diem;
                
                let j = dg.querySelector('.oColJ')?.value.trim() || "";
                let k = dg.querySelector('.oColK')?.value.trim() || "";
                let l = dg.querySelector('.oColL')?.value.trim() || "";
                let m = dg.querySelector('.oColM')?.value.trim() || "";
                
                if (j !== "" || k !== "" || l !== "" || m !== "") {
                    hasJMLogic = true;
                    let rank = 0;
                    if (kiemTraTatCaRangBuoc(valThuc, j)) rank = 4;
                    else if (kiemTraTatCaRangBuoc(valThuc, k)) rank = 3;
                    else if (kiemTraTatCaRangBuoc(valThuc, l)) rank = 2;
                    else if (kiemTraTatCaRangBuoc(valThuc, m)) rank = 1;
                    if (rank > 0) minRank = Math.min(minRank, rank);
                    else minRank = Math.min(minRank, 1);
                }
            }
        }
    });
    
    let diemCuoiCung = tongDiem + dc;
    let xpl = "Chưa hoàn thành";
    
    if (soNhiemVu === 0) {
        xpl = "Chưa giao việc";
    } else if (soDaDanhGia < soNhiemVu) {
        xpl = "Chưa đánh giá";
    } else {
        if (hasJMLogic) {
            if (minRank === 4) xpl = "Xuất sắc";
            else if (minRank === 3) xpl = "Hoàn thành tốt";
            else if (minRank === 2) xpl = "Hoàn thành";
            else if (minRank === 1) xpl = "Chưa hoàn thành";
            else xpl = "Chưa xác định";
        } else {
            let tyLe = tongMax > 0 ? (diemCuoiCung / tongMax) * 100 : diemCuoiCung;
            if (tyLe >= 90) xpl = "Xuất sắc";
            else if (tyLe >= 70) xpl = "Hoàn thành tốt";
            else if (tyLe >= 50) xpl = "Hoàn thành";
            else xpl = "Chưa hoàn thành";
        }
    }
    
    let txtKq = xpl;
    if (soNhiemVu > 0 && soDaDanhGia === soNhiemVu && xpl !== "Chưa giao việc" && xpl !== "Chưa đánh giá") {
        txtKq = `${xpl}: ${diemCuoiCung} điểm`;
    }
    
    const qht = document.getElementById('chuKqHthi');
    if (qht) { 
        qht.innerText = txtKq; 
        qht.className = "fw-bold epMotDong"; 
        if (xpl === "Xuất sắc") qht.classList.add("text-success"); 
        else if (xpl.includes("Hoàn thành")) qht.classList.add("text-primary"); 
        else qht.classList.add("text-danger"); 
    }
    
    const theMenuDoc = document.querySelectorAll('#oKetQuaMenuDoc, .oKetQuaMenuDoc, .ketQuaMenuDoc');
    theMenuDoc.forEach(el => {
        el.innerText = txtKq;
        el.className = "epMotDong"; 
        if (xpl === "Xuất sắc") el.classList.add("text-success", "fw-bold"); 
        else if (xpl.includes("Hoàn thành")) el.classList.add("text-primary", "fw-bold"); 
        else el.classList.add("text-danger", "fw-bold"); 
    });
}
