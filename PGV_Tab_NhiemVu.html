<script>
// Biến lưu danh sách file đính kèm (đã upload thành công)
window.dsFileDinhKem = window.dsFileDinhKem || [];
// Hàng đợi file chờ upload
window.queueUploadFile = [];
// Đang upload hay không
window.dangUploadFile = false;

let mbcMo = false; let cotETonTai = false; let giaTriCotE = ""; let dsGiaoVien = [];

function kiemTraLaBGH() {
    if (typeof window.PGV_QUYEN !== 'undefined' && (window.PGV_QUYEN === 'xxx' || window.PGV_QUYEN === 'xx')) return true;
    if (typeof canbHientai !== 'undefined' && (canbHientai.quyen === 'xxx' || canbHientai.quyen === 'xx')) return true;
    return false;
}

function kiemTraQuyenTruyCap() {
    var selectGv = document.getElementById("hopChonGv"); 
    var nutLuu = document.getElementById("nutLuuTam"); 
    var nutNop = document.getElementById("nutNopBcao");
    var diemThuong = document.getElementById("nhapDiemThuong");
    var isBGH = kiemTraLaBGH();

    if (cotETonTai && selectGv && selectGv.style.display !== "none") {
        var daChon = selectGv.value && selectGv.value !== "";
        if (daChon) { 
            if (isBGH) {
                if (nutLuu) nutLuu.disabled = false; 
                if (diemThuong) diemThuong.disabled = false;
                if (nutNop) nutNop.disabled = true; 
            } else {
                if (nutLuu) nutLuu.disabled = true; 
                if (nutNop) nutNop.disabled = true; 
                if (diemThuong) diemThuong.disabled = true;
                if (typeof hienThongb === 'function') hienThongb('chuy', '⚠️ Bạn đang xem nhật ký của giáo viên khác. Chỉ giáo viên đó hoặc Ban Giám hiệu mới được lưu.'); 
            }
        } else { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        }
    } else { 
        if (window.PGV_IS_SELF || isBGH) { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        } 
    }
}

function khoiTaoDropdownGiaoVien(danhSachGiaoVien) {
    var selectGv = document.getElementById("hopChonGv"); if (!selectGv) return;
    selectGv.innerHTML = '<option value="">-- Lựa chọn giáo viên --</option>';
    if (danhSachGiaoVien && danhSachGiaoVien.length > 0) { danhSachGiaoVien.forEach(function(gv) { var option = document.createElement("option"); option.value = gv.id || gv.ma || gv.ttrg; option.textContent = gv.ten || gv.hoTen || gv.tenn; selectGv.appendChild(option); }); selectGv.style.display = "inline-block"; selectGv.disabled = false; } 
    else { selectGv.style.display = "none"; selectGv.disabled = true; }
}

function xuLyCotE(giaTriE, danhSachGiaoVien) { 
    cotETonTai = true; giaTriCotE = giaTriE; dsGiaoVien = danhSachGiaoVien || []; 
    khoiTaoDropdownGiaoVien(dsGiaoVien); 
    kiemTraQuyenTruyCap(); 
}

function cdang(ptu) { 
    if(!ptu) return;
    ptu.style.height = 'auto'; 
    ptu.style.height = (ptu.scrollHeight) + 'px'; 
}
function gdang(ptu) { ptu.style.height = 'auto'; ptu.style.height = ptu.scrollHeight + 'px'; }
function cgon(ptu, ccao) { ptu.style.height = ccao; ptu.scrollTop = 0; }

function maHoaBcao(chu, dsFile) { 
    var q = (chu || "").trim(); 
    if (dsFile && dsFile.length > 0) { 
        dsFile.forEach(function(f) { 
            if (f.duongDan) {
                q += ' [FILE:' + f.tentep + '|' + f.duongDan + ']'; 
            } else {
                q += ' [FILE:' + f.tentep + ']';
            }
        }); 
    } 
    return q; 
}

// ==================== UPLOAD FILE LÊN SERVER ====================
function uploadFileLenServer(file, callback) {
    var formData = new FormData();
    formData.append('file', file);
    formData.append('loai', 'baocao');
    formData.append('thoiGian', new Date().toISOString());
    
    // Lấy thông tin giáo viên để phân loại file
    var maGV = '';
    if (typeof canbHientai !== 'undefined' && canbHientai && canbHientai.canb) {
        maGV = canbHientai.canb.ttrg || '';
    }
    formData.append('maGV', maGV);
    
    // Gọi API upload file (cần server hỗ trợ)
    if (typeof khachApi !== 'undefined' && typeof khachApi.uploadFile === 'function') {
        khachApi.uploadFile(formData, function(kq) {
            if (kq && kq.ttai === 'tcong' && kq.duongDan) {
                callback(null, {
                    tentep: file.name,
                    duongDan: kq.duongDan,
                    kichthuoc: file.size,
                    loai: file.type
                });
            } else {
                callback(new Error(kq ? kq.tbao : 'Upload thất bại'), null);
            }
        }, function(err) {
            callback(err, null);
        });
    } else {
        // Nếu chưa có API upload, giả lập bằng base64 (vẫn bị giới hạn ký tự)
        var reader = new FileReader();
        reader.onload = function(e) {
            callback(null, {
                tentep: file.name,
                duongDan: e.target.result,
                kichthuoc: file.size,
                loai: file.type,
                isBase64: true
            });
        };
        reader.onerror = function() {
            callback(new Error('Đọc file thất bại'), null);
        };
        reader.readAsDataURL(file);
    }
}

function xuLyHangDoiUpload() {
    if (window.dangUploadFile) return;
    if (!window.queueUploadFile || window.queueUploadFile.length === 0) return;
    
    window.dangUploadFile = true;
    var item = window.queueUploadFile.shift();
    var file = item.file;
    var badgeElement = item.badgeElement;
    
    // Cập nhật trạng thái đang upload
    if (badgeElement) {
        badgeElement.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Đang upload ' + file.name + '...';
        badgeElement.style.opacity = '0.6';
    }
    
    uploadFileLenServer(file, function(err, result) {
        if (err) {
            if (typeof hienThongb === 'function') {
                hienThongb('loi', 'Upload file "' + file.name + '" thất bại: ' + err.message);
            } else {
                alert('Upload file "' + file.name + '" thất bại: ' + err.message);
            }
            if (badgeElement) badgeElement.remove();
        } else {
            window.dsFileDinhKem.push(result);
            if (badgeElement) {
                // Hiển thị thành công với link tải
                var linkTai = result.duongDan;
                var isBase64 = result.isBase64 || false;
                badgeElement.innerHTML = '<i class="bi bi-file-earmark-text"></i>' +
                    (isBase64 ? 
                        '<span style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="' + result.tentep + ' (base64)">' + result.tentep + '</span>' :
                        '<a href="' + linkTai + '" target="_blank" class="file-link" style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;" title="Tải về: ' + result.tentep + '">' + result.tentep + '</a>'
                    ) +
                    '<span class="btn-close btn-close-sm" onclick="xoaFileDinhKem(this)" style="font-size: 10px; cursor: pointer;" aria-label="Xóa"></span>';
                badgeElement.style.opacity = '1';
                badgeElement.setAttribute('data-filename', result.tentep);
                badgeElement.setAttribute('data-path', linkTai);
            }
        }
        window.dangUploadFile = false;
        xuLyHangDoiUpload();
    });
}

function xulyTaiBcao(input) {
    if (!input.files || input.files.length === 0) return;
    
    var vungDinhk = document.getElementById('vungDinhkBcao');
    if (!vungDinhk) return;
    
    for (var i = 0; i < input.files.length; i++) {
        var file = input.files[i];
        var fileName = file.name;
        
        // Kiểm tra trùng tên file
        var isDuplicate = window.dsFileDinhKem.some(function(f) { return f.tentep === fileName; });
        if (isDuplicate) {
            if (typeof hienThongb === 'function') {
                hienThongb('cbh', 'File "' + fileName + '" đã được đính kèm trước đó!');
            }
            continue;
        }
        
        // Tạo badge tạm thời
        var badge = document.createElement('span');
        badge.className = 'file-badge';
        badge.style.opacity = '0.6';
        badge.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Đang upload ' + fileName + '...';
        vungDinhk.appendChild(badge);
        
        // Thêm vào hàng đợi upload
        window.queueUploadFile.push({
            file: file,
            badgeElement: badge
        });
    }
    
    input.value = '';
    xuLyHangDoiUpload();
}

function hienThiFileDinhKemTuDanhSach(fileData, container) {
    var badge = document.createElement('span');
    badge.className = 'file-badge';
    badge.setAttribute('data-filename', fileData.tentep);
    if (fileData.duongDan) badge.setAttribute('data-path', fileData.duongDan);
    
    var isBase64 = fileData.duongDan && fileData.duongDan.startsWith('data:');
    
    if (isBase64) {
        badge.innerHTML = '<i class="bi bi-file-earmark-text"></i>' +
            '<span style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="' + fileData.tentep + ' (base64)">' + fileData.tentep + '</span>' +
            '<span class="btn-close btn-close-sm" onclick="xoaFileDinhKem(this)" style="font-size: 10px; cursor: pointer;" aria-label="Xóa"></span>';
    } else if (fileData.duongDan) {
        badge.innerHTML = '<i class="bi bi-file-earmark-text"></i>' +
            '<a href="' + fileData.duongDan + '" target="_blank" class="file-link" style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;" title="Tải về: ' + fileData.tentep + '">' + fileData.tentep + '</a>' +
            '<span class="btn-close btn-close-sm" onclick="xoaFileDinhKem(this)" style="font-size: 10px; cursor: pointer;" aria-label="Xóa"></span>';
    } else {
        badge.innerHTML = '<i class="bi bi-file-earmark-text"></i>' +
            '<span style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + fileData.tentep + '</span>' +
            '<span class="btn-close btn-close-sm" onclick="xoaFileDinhKem(this)" style="font-size: 10px; cursor: pointer;" aria-label="Xóa"></span>';
    }
    
    container.appendChild(badge);
}

function xoaFileDinhKem(btnElement) {
    var badge = btnElement.closest('.file-badge');
    if (badge) {
        var fileName = badge.getAttribute('data-filename');
        window.dsFileDinhKem = window.dsFileDinhKem.filter(function(f) { return f.tentep !== fileName; });
        badge.remove();
    }
}

// Hàm tải lại danh sách file từ dữ liệu cũ (khi load lại trang)
function taiDanhSachFileTuChuoi(chuoiBaoCao) {
    if (!chuoiBaoCao) return;
    var regex = /\[FILE:([^|\]]+)(?:\|([^\]]+))?\]/g;
    var match;
    var vungDinhk = document.getElementById('vungDinhkBcao');
    if (!vungDinhk) return;
    
    window.dsFileDinhKem = [];
    vungDinhk.innerHTML = '';
    
    while ((match = regex.exec(chuoiBaoCao)) !== null) {
        var tenFile = match[1];
        var duongDan = match[2] || '';
        if (tenFile) {
            var fileData = { tentep: tenFile, duongDan: duongDan };
            window.dsFileDinhKem.push(fileData);
            hienThiFileDinhKemTuDanhSach(fileData, vungDinhk);
        }
    }
}
// ==================== KẾT THÚC XỬ LÝ FILE ====================

function xulyLuuTam(ath, xltc) {
    if (typeof ath === 'undefined') ath = false;
    var isBGH = kiemTraLaBGH();
    var maTrangDich = (typeof canbHientai !== 'undefined' && canbHientai && canbHientai.canb) ? canbHientai.canb.ttrg : "";

    if (cotETonTai) { 
        var selectGv = document.getElementById("hopChonGv"); 
        if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { 
            if (!isBGH) { 
                if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Bạn không có quyền lưu nhật ký đánh giá của người khác."); 
                return; 
            } 
            maTrangDich = selectGv.value;
        } else if (isBGH) {
            if (!maTrangDich || maTrangDich.trim() === "") {
                if (typeof hienThongb === 'function') hienThongb('cbh', "⚠️ Đồng chí vui lòng chọn một giáo viên từ danh sách trước khi lưu.");
                return;
            }
        }
    }

function nopBcaoChinh() {
    var isBGH = kiemTraLaBGH();
    var maTrangDich = (typeof canbHientai !== 'undefined' && canbHientai && canbHientai.canb) ? canbHientai.canb.ttrg : "";

    if (cotETonTai) { 
        var selectGv = document.getElementById("hopChonGv"); 
        if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { 
            if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Bạn không có quyền nộp báo cáo thay cho giáo viên khác."); 
            return; 
        } 
    }
    if (!window.PGV_IS_SELF && !isBGH) { 
        if (typeof hienThongb === 'function') hienThongb('loi', "Bạn không có quyền nộp báo cáo của người khác."); 
        return; 
    }
    if (!maTrangDich || maTrangDich.trim() === "") {
        if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi: Không xác định được mã hồ sơ để nộp báo cáo.");
        return;
    }

        if (typeof hienThongb === 'function') hienThongb('cbh', 'Bạn đã có ' + gn + ' ngày nghỉ.\nPhải nhập lý do!'); 
        return; 
    }
    
    var yk = $('#nhapYkien').val().trim(), bc = $('#nhapBcao').val().trim();
    if (yk === "" || bc === "") { 
        if (typeof hienThongb === 'function') hienThongb('loi', "Thiếu: Ý kiến tham mưu hoặc Báo cáo tóm tắt"); 
        return; 
    }
    
    var bhl = true;
    $('#bangNviec tbody tr.dongNv').each(function(i) {
      var selectKq = $(this).find('.chonKq');

              bhl = false; 
              return false; 
          }
      }
    }); 
    if (!bhl) return;

    // Kiểm tra nếu còn file đang upload
    if (window.dangUploadFile || (window.queueUploadFile && window.queueUploadFile.length > 0)) {
        if (typeof hienThongb === 'function') {
            hienThongb('cbh', 'Đang có file đang được upload. Vui lòng chờ upload hoàn tất rồi nộp báo cáo.');
        }
        return;
    }

    if (typeof hienThongb === 'function') {
        hienThongb('xn', "Hệ thống sẽ đồng bộ nhật ký và nộp báo cáo. Xác nhận?", function() {

        }
    }

function ktraAnHienTieuDe(ptu) {
    var isTitle = ptu.value.trim().startsWith('*');

    var tdNoiDung = ptu.closest('td');
    
    if(isTitle) {
        ptu.classList.add('fw-bold', 'text-primary', 'text-uppercase');
        tdNoiDung.colSpan = 7;
        tr.querySelectorAll('td:nth-child(n+3)').forEach(function(td) { td.style.display = 'none'; });
    } else {
        ptu.classList.remove('fw-bold', 'text-primary', 'text-uppercase');
        tdNoiDung.colSpan = 1;
        tr.querySelectorAll('td:nth-child(n+3)').forEach(function(td) { td.style.display = ''; });

    tinhtTdong();
}

function veBangNviec(db) {
    khaBcao(); 
    var bg = $('#bangNviec tbody').empty();

        bg.append('<tr><td colspan=\"8\" class=\"text-center text-muted py-3 small\">Chưa có nhiệm vụ.</td></tr>'); 
        tinhtTdong(); 
        return; 
    }
    
    var showDeleteBtn = window.PGV_CAN_SHOW_DELETE_BUTTON === true;
    for (var idx = 0; idx < db.length; idx++) {
        var dong = db[idx];
        var sn = (dong[0] !== null && dong[0] !== undefined && dong[0] !== "") ? dong[0] : "";
        var ndc = dong[1] || ""; 
        var dMax = dong[2] || ""; 
        
        var tGiao = (dong[3] !== undefined && dong[3] !== null) ? String(dong[3]) : "";
        var tHt   = (dong[5] !== undefined && dong[5] !== null) ? String(dong[5]) : "";
        
        var lTdo = dong[4] || ""; 
        var nTH = dong[6] || ""; 
        var rawH = dong[7] || ""; 
        var gc = dong[8] || "";
        
        var j_val = dong[9] || ""; 
        var k_val = dong[10] || ""; 
        var l_val = dong[11] || ""; 
        var m_val = dong[12] || "";
        
        var valChon = ""; 
        var valConfig = rawH;
        if(rawH.includes("@@@")) { 
            var p = rawH.split("@@@"); 
            valChon = p[0]; 
            valConfig = p[1]; 
        } else if(!rawH.includes("|") && rawH !== "") { 
            valChon = rawH; 
            valConfig = rawH; 
        }
        
        var safeConfig = valConfig.replace(/"/g, '&quot;');

        var isTitle = ndc.trim().startsWith('*');
        var dsp = isTitle ? 'display: none;' : '';
        var fw = isTitle ? 'fw-bold text-primary text-uppercase' : '';
        var colSp = isTitle ? 'colspan="7"' : '';

        var vTgGiao = (tGiao.toLowerCase() === "dd/mm/yyyy") ? "" : tGiao;
        var vTgHt   = (tHt.toLowerCase() === "dd/mm/yyyy") ? "" : tHt;

        var htmlDiem = '<input type="text" class="form-control form-control-sm text-center fw-bold chonKq" data-config="' + safeConfig + '" value="' + valChon.replace(/"/g, '&quot;') + '" style="color:red; ' + dsp + '" onchange="tinhtTdong()">';
        
        if (valConfig.includes("|")) {
            htmlDiem = '<select class="form-select form-select-sm text-center fw-bold chonKq" data-config="' + safeConfig + '" style="color:red; ' + dsp + '; max-width: 100%;" onchange="tinhtTdong()">';
            htmlDiem += '<option value="" style="text-align: left; padding: 0px; margin: 0px; white-space: normal;">-- Trống --</option>';
            
            var optsArray = [];
            if (valConfig.includes(";")) {
                optsArray = valConfig.split(";");
            } else if (valConfig.includes("\n")) {
                var lines = valConfig.split("\n");
                var currentOpt = "";
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (line === "") continue; 
                    currentOpt = currentOpt === "" ? line : currentOpt + " " + line;
                    if (line.includes("|") || i === lines.length - 1) {
                        optsArray.push(currentOpt);
                        currentOpt = "";
                    }
                }
            } else {
                optsArray = valConfig.split(",");
            }

            for (var oi = 0; oi < optsArray.length; oi++) {
                var opt = optsArray[oi];
                var kv = opt.split("|"); 
                var txt = kv[0].replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim(); 
                var val = kv.length > 1 ? kv[1].replace(/[\r\n]+/g, '').trim() : txt;
                
                if(txt !== "") {
                    var isSel = (val === valChon) ? "selected" : "";
                    var safeTxt = txt.replace(/"/g, '&quot;');
                    htmlDiem += '<option value="' + val.replace(/"/g, '&quot;') + '" ' + isSel + ' title="' + safeTxt + '" style="text-align: left; padding: 0px; margin: 0px; white-space: normal; word-wrap: break-word; max-width: 350px;">' + txt + '</option>';
                }
            }
            htmlDiem += '</select>';
        }

        var nutx = showDeleteBtn ? '<button class="btn btn-sm btn-danger py-0 px-2" onclick="xoaDongNv(this)">✕</button>' : '';
        var dg = '<tr class="dongNv">' +
          '<td class="text-center align-middle oStt fw-bold">' + sn.replace(/"/g, '&quot;') + '</td>' +
          '<td ' + colSp + '>' +
              '<textarea class="form-control nhapNdung ' + fw + '" readonly rows="1" oninput="cdang(this)" onfocus="cdang(this)">' + ndc.replace(/</g, '&lt;') + '</textarea>' +
              '<input type="hidden" class="anNguoiTH" value="' + nTH.replace(/"/g, '&quot;') + '">' +
              '<input type="hidden" class="anGhiChu" value="' + gc.replace(/</g, '&lt;') + '">' +
              '<input type="hidden" class="oColJ" value="' + j_val.replace(/"/g, '&quot;') + '">' +
              '<input type="hidden" class="oColK" value="' + k_val.replace(/"/g, '&quot;') + '">' +
              '<input type="hidden" class="oColL" value="' + l_val.replace(/"/g, '&quot;') + '">' +
              '<input type="hidden" class="oColM" value="' + m_val.replace(/"/g, '&quot;') + '">' +
            '</td>' +
          '<td class="align-middle" style="' + dsp + '"><input type="text" class="form-control form-control-sm text-center nhapDiemMax" value="' + dMax.replace(/"/g, '&quot;') + '" readonly></td>' +
          '<td class="align-middle" style="' + dsp + '"><input type="text" class="form-control form-control-sm text-center nhapTgGiao" placeholder="dd/mm/yyyy" value="' + vTgGiao.replace(/"/g, '&quot;') + '" readonly></td>' +
          '<td class="align-middle" style="' + dsp + '"><input type="text" class="form-control form-control-sm text-center nhapTdo" value="' + lTdo.replace(/</g, '&lt;') + '" readonly></td>' +
          '<td class="align-middle" style="' + dsp + '"><input type="text" class="form-control form-control-sm text-center nhapTgHt" placeholder="dd/mm/yyyy" value="' + vTgHt.replace(/"/g, '&quot;') + '"></td>' +
          '<td class="align-middle" style="' + dsp + '">' + htmlDiem + '</td>' +
          '<td class="text-center align-middle" style="' + dsp + '">' + nutx + '</td>' +
        '</tr>';
        bg.append(dg);
    }
    
    setTimeout(function() { 
        $('#bangNviec textarea').each(function() { cdang(this); }); 
        tinhtTdong(); 
        khaBcao(); 
    }, 100);
}

function kiemTraTatCaRangBuoc(giaTriThuc, chuoiDieuKien) {
    if (!chuoiDieuKien || chuoiDieuKien.trim() === "") return false;
    var str = chuoiDieuKien.trim();
    var constraints = [];
    if (str.includes(',')) constraints = str.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
    else if (str.includes(' ')) constraints = str.split(/\s+/).filter(function(s){ return s; });
    else constraints = [str];
    if (constraints.length === 0) return false;
    var numVal = parseFloat(String(giaTriThuc).replace(/[^\d.-]/g, ''));
    if (isNaN(numVal)) return false;
    for (var c = 0; c < constraints.length; c++) {
        var cond = constraints[c];
        if (cond.startsWith(">=")) {
            var threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal >= threshold)) return false;
        } else if (cond.startsWith("<=")) {
            var threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal <= threshold)) return false;
        } else if (cond.startsWith(">") && !cond.startsWith(">=")) {
            var threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal > threshold)) return false;
        } else if (cond.startsWith("<") && !cond.startsWith("<=")) {
            var threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal < threshold)) return false;
        } else {
            var exact = parseFloat(cond.replace(/[^\d.-]/g, ''));
            if (isNaN(exact)) return false;
            if (Math.abs(numVal - exact) > 1e-9) return false;
        }
    }
    return true;
}

function tinhtTdong() {
    var dtc = document.getElementById('nhapDiemThuong'); 
    var dc = dtc ? (parseFloat(dtc.value) || 0) : 0;
    if(dtc) { 
        dtc.classList.remove('diemCong', 'diemTru', 'diemKhong'); 
        if (dc > 0) dtc.classList.add('diemCong'); 
        else if (dc < 0) dtc.classList.add('diemTru'); 
        else dtc.classList.add('diemKhong'); 
    }
    
    var tongDiem = 0;
    var tongMax = 0;
    var soNhiemVu = 0;
    var soDaDanhGia = 0;
    var minRank = 5;
    var hasJMLogic = false;

    var rows = document.querySelectorAll('#bangNviec tbody tr.dongNv');
    for (var r = 0; r < rows.length; r++) {
        var dg = rows[r];
        var cg = dg.querySelector('.chonKq');
        if (cg && cg.style.display !== 'none') {
            soNhiemVu++;
            var maxInp = dg.querySelector('.nhapDiemMax');
            if(maxInp && maxInp.value) {
                var mVal = parseFloat(maxInp.value);
                if(!isNaN(mVal)) tongMax += mVal;
            }
            if (cg.value !== "") {
                soDaDanhGia++;
                var valThuc = cg.value.trim();
                var diem = parseFloat(valThuc);
                if (!isNaN(diem)) tongDiem += diem;
                
                var j = (dg.querySelector('.oColJ') && dg.querySelector('.oColJ').value) ? dg.querySelector('.oColJ').value.trim() : "";
                var k = (dg.querySelector('.oColK') && dg.querySelector('.oColK').value) ? dg.querySelector('.oColK').value.trim() : "";
                var l = (dg.querySelector('.oColL') && dg.querySelector('.oColL').value) ? dg.querySelector('.oColL').value.trim() : "";
                var m = (dg.querySelector('.oColM') && dg.querySelector('.oColM').value) ? dg.querySelector('.oColM').value.trim() : "";
                
                if (j !== "" || k !== "" || l !== "" || m !== "") {
                    hasJMLogic = true;
                    var rank = 0;
                    if (kiemTraTatCaRangBuoc(valThuc, j)) rank = 4;
                    else if (kiemTraTatCaRangBuoc(valThuc, k)) rank = 3;
                    else if (kiemTraTatCaRangBuoc(valThuc, l)) rank = 2;
                    else if (kiemTraTatCaRangBuoc(valThuc, m)) rank = 1;
                    if (rank > 0) minRank = Math.min(minRank, rank);
                    else minRank = Math.min(minRank, 1);
                }
            }
        }
    }
    
    var diemCuoiCung = tongDiem + dc;
    var xpl = "Chưa hoàn thành";
    
    if (soNhiemVu === 0) {
        xpl = "Chưa giao việc";
    } else if (soDaDanhGia < soNhiemVu) {
        xpl = "Chưa đánh giá";
    } else {
        if (hasJMLogic) {
            if (minRank === 4) xpl = "Xuất sắc";
            else if (minRank === 3) xpl = "Hoàn thành tốt";
            else if (minRank === 2) xpl = "Hoàn thành";
            else if (minRank === 1) xpl = "Chưa hoàn thành";
            else xpl = "Chưa xác định";
        } else {
            var tyLe = tongMax > 0 ? (diemCuoiCung / tongMax) * 100 : diemCuoiCung;
            if (tyLe >= 90) xpl = "Xuất sắc";
            else if (tyLe >= 70) xpl = "Hoàn thành tốt";
            else if (tyLe >= 50) xpl = "Hoàn thành";
            else xpl = "Chưa hoàn thành";
        }
    }
    
    var txtKq = xpl;
    if (soNhiemVu > 0 && soDaDanhGia === soNhiemVu && xpl !== "Chưa giao việc" && xpl !== "Chưa đánh giá") {
        txtKq = xpl + ": " + diemCuoiCung + " điểm";
    }
    
    var qht = document.getElementById('chuKqHthi');
    if (qht) { 
        qht.innerText = txtKq; 
        qht.className = "fw-bold epMotDong"; 
        if (xpl === "Xuất sắc") qht.classList.add("text-success"); 
        else if (xpl.indexOf("Hoàn thành") >= 0) qht.classList.add("text-primary"); 
        else qht.classList.add("text-danger"); 
    }
    
    var theMenuDoc = document.querySelectorAll('#oKetQuaMenuDoc, .oKetQuaMenuDoc, .ketQuaMenuDoc');
    for (var i = 0; i < theMenuDoc.length; i++) {
        var el = theMenuDoc[i];
        el.innerText = txtKq;
        el.className = "epMotDong"; 
        if (xpl === "Xuất sắc") el.classList.add("text-success", "fw-bold"); 
        else if (xpl.indexOf("Hoàn thành") >= 0) el.classList.add("text-primary", "fw-bold"); 
        else el.classList.add("text-danger", "fw-bold"); 
    }
}

function capnhTdong() { tinhtTdong(); }
